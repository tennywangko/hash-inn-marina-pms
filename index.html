<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --navy:#0B2A4A;
    --navy-2:#123A63;
    --navy-3:#1B4B7C;
    --accent:#4F9FD8;
    --accent-soft:#E9F3FB;
    --bg:#F2F6FA;
    --card:#FFFFFF;
    --border:#DFE6EE;
    --text:#152436;
    --text-muted:#66768A;
    --green:#2F9E5C; --green-soft:#E7F6EC;
    --amber:#C98A1E; --amber-soft:#FBF1DE;
    --blue:#2C6FBB; --blue-soft:#E7F0FB;
    --red:#C24C43; --red-soft:#FBEAE8;
    --gray:#7C8794; --gray-soft:#EEF1F4;
    --radius:10px;
    --shadow:0 1px 2px rgba(11,42,74,0.06), 0 4px 14px rgba(11,42,74,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  header{background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow);position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:15px;}
  .brand-text h1{font-size:16px;margin:0;letter-spacing:.2px;}
  .brand-text span{font-size:11px;color:#BFD9F0;}
  .role-switch{display:flex;align-items:center;gap:8px;font-size:12px;}
  .role-switch select{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:7px 10px;border-radius:8px;font-size:12.5px;}
  .role-switch select option{color:#111;}
  .clockbox{font-size:11px;color:#BFD9F0;text-align:right;}

  nav{background:var(--navy-2);display:flex;gap:2px;padding:0 16px;overflow-x:auto;}
  nav button{background:transparent;border:none;color:#CFE1F2;padding:11px 14px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav button.active{color:#fff;border-bottom:3px solid var(--accent);font-weight:600;}
  nav button:hover{color:#fff;}

  main{flex:1;padding:20px 22px 60px;max-width:1280px;width:100%;margin:0 auto;}

  h2.page-title{font-size:19px;margin:2px 0 16px;color:var(--navy);}
  .sub{color:var(--text-muted);font-size:12.5px;margin-top:-10px;margin-bottom:16px;}

  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .kpi .label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
  .kpi .value{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;}
  .kpi .hint{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted);padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty-row td{color:var(--text-muted);text-align:center;padding:18px;font-style:italic;}

  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;font-weight:600;}
  .btn:hover{background:var(--navy-2);}
  .btn.secondary{background:var(--accent-soft);color:var(--navy);border:1px solid var(--border);}
  .btn.secondary:hover{background:#DEEDF9;}
  .btn.small{padding:5px 10px;font-size:11.5px;}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--border);}
  .btn.danger{background:var(--red-soft);color:var(--red);border:1px solid #F1CFCB;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar-left{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text],input[type=date],input[type=number],input[type=tel],select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);}
  textarea{width:100%;resize:vertical;}
  label{font-size:11.5px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
  .field{margin-bottom:12px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
  .b-green{background:var(--green-soft);color:var(--green);}
  .b-amber{background:var(--amber-soft);color:var(--amber);}
  .b-blue{background:var(--blue-soft);color:var(--blue);}
  .b-red{background:var(--red-soft);color:var(--red);}
  .b-gray{background:var(--gray-soft);color:var(--gray);}

  .floor-block{margin-bottom:22px;}
  .floor-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;}
  .room-tile{border-radius:9px;padding:10px 10px 9px;cursor:pointer;border:1px solid transparent;transition:transform .08s ease;position:relative;}
  .room-tile:hover{transform:translateY(-2px);}
  .room-tile .rnum{font-size:15px;font-weight:800;}
  .room-tile .rtype{font-size:10.5px;opacity:.85;margin-top:1px;}
  .room-tile .rstat{font-size:10px;margin-top:7px;font-weight:700;}
  .rt-clean{background:var(--green-soft);color:var(--green);}
  .rt-dirty{background:var(--amber-soft);color:var(--amber);}
  .rt-occupied{background:var(--blue-soft);color:var(--blue);}
  .rt-service{background:#FCEADD;color:#C2691E;}
  .rt-ooo{background:var(--gray-soft);color:var(--gray);}
  .rt-hu{background:#EFE7F9;color:#6B4FA0;}
  .rt-inprogress{background:#E3F3F1;color:#1F8A7A;}
  .rt-inspect{background:#E8ECFD;color:#3D4FC4;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:11.5px;color:var(--text-muted);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .cal-wrap{overflow-x:auto;}
  .cal-table{border-collapse:collapse;font-size:11.5px;min-width:1100px;}
  .cal-table th,.cal-table td{border:1px solid var(--border);padding:5px 6px;text-align:center;}
  .cal-table th{background:var(--accent-soft);color:var(--navy);font-weight:700;position:sticky;top:0;}
  .cal-table td.roomcell{background:#fafcfe;font-weight:700;color:var(--navy);text-align:left;position:sticky;left:0;}
  .cal-book{display:block;border-radius:5px;padding:3px 4px;font-size:10.5px;font-weight:700;color:#fff;cursor:pointer;}
  .cal-today{background:var(--accent-soft)!important;}

  .modal-bg{position:fixed;inset:0;background:rgba(11,20,32,0.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:200;overflow-y:auto;}
  .modal{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:22px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal.wide{max-width:780px;}

  .reg-card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .reg-head{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--navy);}
  .reg-head>div{padding:12px 16px;}
  .reg-head .left{border-right:1px solid var(--border);font-weight:800;color:var(--navy);font-size:12.5px;}
  .reg-head .right{text-align:right;font-weight:800;color:var(--navy);font-size:12.5px;}
  .reg-head .sub{display:block;font-weight:400;font-style:italic;font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .reg-instruction{padding:7px 16px;font-size:10.5px;font-style:italic;color:var(--text-muted);border-bottom:1px solid var(--border);background:#fafcfe;}
  .reg-section{background:var(--navy);color:#fff;padding:6px 16px;font-size:11px;font-weight:800;letter-spacing:.3px;}
  .reg-section .sub{font-weight:400;font-style:italic;opacity:.85;margin-left:4px;font-size:10px;}
  .reg-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);}
  .reg-cell{padding:7px 16px;border-right:1px solid var(--border);}
  .reg-cell:last-child{border-right:none;}
  .reg-cell .lab{font-size:9.5px;font-weight:700;color:var(--navy);}
  .reg-cell .lab .en{font-style:italic;font-weight:400;color:var(--text-muted);}
  .reg-cell .val{margin-top:4px;font-size:12px;min-height:15px;border-bottom:1px solid #d5dbe2;padding-bottom:2px;}

async function migrateRoomPlanIfNeeded(){
  if(DB.roomPlanVersion === 2) return;
  const newRooms = buildRoomPlan();
  newRooms.forEach(nr=>{
    const old = (DB.rooms||[]).find(r=>r.number===nr.number);
    if(old){ nr.hk = old.hk || nr.hk; nr.oooReason = old.oooReason || ''; }
  });
  const validNumbers = new Set(newRooms.map(r=>r.number));
  const dropped = (DB.bookings||[]).filter(b=>!validNumbers.has(b.roomNumber));
  DB.bookings = (DB.bookings||[]).filter(b=>validNumbers.has(b.roomNumber));
  DB.rooms = newRooms;
  DB.roomPlanVersion = 2;
  if(dropped.length){
    DB.migrationNote = `Room plan updated to match your real property layout (Floors 2\u20135, 47 rooms). ${dropped.length} booking(s) on room numbers that no longer exist (from the old placeholder layout) were removed.`;
  }
  await persist();
}

async function migratePackagesIfNeeded(){
  if(DB.packages) return;
  const legacyPrice = (DB.settings && DB.settings.sspPrice) || 75000;
  DB.packages = [{
    id:'pkg_ssp', name:'Ship Schedule Package', price:legacyPrice,
    description:'Early check-in at docking time, 16:00 late check-out, breakfast included', active:true

  (DB.bookings||[]).forEach(b=>{
    if(b.sspEnabled){
      b.packageId='pkg_ssp'; b.packageName='Ship Schedule Package'; b.packagePrice=legacyPrice;
    } else {
      b.packageId = b.packageId || null; b.packageName = b.packageName || ''; b.packagePrice = b.packagePrice || 0;
    }
    delete b.sspEnabled;
  });
  await persist();
}

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10 ? '0'+n : ''+n; }

function fmtDate(dateStr){ if(!dateStr) return '—'; const d=new Date(dateStr+'T00:00:00'); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear(); }
function fmtDMY(dateStr){ if(!dateStr) return '__ / __ / ____'; const d=new Date(dateStr+'T00:00:00'); return pad(d.getDate())+' / '+pad(d.getMonth()+1)+' / '+d.getFullYear(); }
function nights(ci,co){ const a=new Date(ci+'T00:00:00'), b=new Date(co+'T00:00:00'); return Math.max(1, Math.round((b-a)/86400000)); }

function roomAvailableForRange(roomNum, checkIn, checkOut, stayType, excludeBookingId){
  const r = room(roomNum);
  if(!r || r.hk==='ooo' || r.hk==='hu') return false;
  return !DB.bookings.some(b=>{
    if(b.id===excludeBookingId) return false;
    if(b.roomNumber!==roomNum) return false;
    if(b.status==='checked_out' || b.status==='cancelled' || b.status==='no_show') return false;
    if(stayType==='dayuse'){
      return b.stayType==='dayuse' ? b.checkIn===checkIn : (checkIn>=b.checkIn && checkIn<b.checkOut);
    }
    if(b.stayType==='dayuse'){
      return b.checkIn>=checkIn && b.checkIn<checkOut;
    }
    return checkIn < b.checkOut && b.checkIn < checkOut;
  });
}

function roomDisplayStatus(r){
  if(r.hk==='ooo') return {key:'ooo', label:tr('legend_ooo'), cls:'rt-ooo'};
  if(r.hk==='hu') return {key:'hu', label:tr('legend_hu'), cls:'rt-hu'};
  const occ = DB.bookings.some(b=>b.roomNumber===r.number && b.status==='checked_in');
  if(occ && (r.hk==='dirty'||r.hk==='in_progress'||r.hk==='inspect')) return {key:'service', label:tr('legend_occupied_service'), cls:'rt-service'};
  if(occ) return {key:'occupied', label:tr('legend_occupied'), cls:'rt-occupied'};
  if(r.hk==='in_progress') return {key:'in_progress', label:tr('legend_inprogress'), cls:'rt-inprogress'};
  if(r.hk==='inspect') return {key:'inspect', label:tr('legend_inspect'), cls:'rt-inspect'};
  if(r.hk==='dirty') return {key:'dirty', label:tr('legend_vacant_dirty'), cls:'rt-dirty'};
  return {key:'clean', label:tr('legend_vacant_clean'), cls:'rt-clean'};
}

function rateFor(type){ return type==='Deluxe' ? DB.settings.deluxeRate : DB.settings.standardRate; }
function dayUseRateFor(type){
  if(type==='Deluxe') return DB.settings.deluxeDayRate || Math.round(DB.settings.deluxeRate/2);
  return DB.settings.standardDayRate || Math.round(DB.settings.standardRate/2);
}

function folioTotal(b){
  const roomTotal = b.roomRate * nights(b.checkIn, b.checkOut);
  const pkg = b.packagePrice || 0;
  const bkfast = (!b.packageId && b.breakfast) ? DB.settings.breakfastPrice * nights(b.checkIn,b.checkOut) * b.pax : 0;
  const extras = (b.charges||[]).reduce((s,c)=>s+c.amount*c.qty,0);
  return roomTotal + pkg + bkfast + extras;
}

async function render(){
  const app = document.getElementById('app');
  if(!UI.session){
    app.innerHTML = renderLoginScreen();
    return;
  }
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if(active && active.id && ['INPUT','TEXTAREA'].includes(active.tagName)){
    focusId = active.id;
    selStart = active.selectionStart;
    selEnd = active.selectionEnd;
  }
  app.innerHTML = `
    ${renderHeader()}
    ${UI.saveError ? `
    <div style="background:#C24C43;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">

      <button class="btn small" style="background:#fff;color:#C24C43;" onclick="retrySave()">Retry Save</button>
    </div>` : ''}
    ${renderNav()}
    <main>${renderTab()}</main>
    ${UI.modal ? renderModalWrap() : ''}
  `;
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function doLogin(){
  const staffId = document.getElementById('loginStaff').value;
  const pin = document.getElementById('loginPin').value;
  const staffMember = (DB.staff||[]).find(s=>s.id===staffId);
  if(!staffMember || staffMember.pin !== pin){
    UI.loginError = 'Incorrect PIN. Please try again.';
    render();
    return;
  }
  UI.session = { staffId: staffMember.id, name: staffMember.name, role: staffMember.role };
  UI.role = staffMember.role;
  UI.loginError = '';
  UI.tab = TABS_BY_ROLE[staffMember.role][0];
  render();
  startLivePolling();
}
function doLogout(){
  UI.session = null;
  UI.modal = null;
  stopLivePolling();
  render();
}

let liveListenerActive = false;
let liveChannel = null;
function startLivePolling(){
  if(liveListenerActive) return;
  liveChannel = supabaseClient
    .channel('pms_data_changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pms_data', filter: `id=eq.${PMS_ROW_ID}` }, (payload) => {
      if(!UI.session || UI.modal) return;
      const active = document.activeElement;
      if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
      const val = payload.new && payload.new.data;
      if(val && JSON.stringify(val) !== JSON.stringify(DB)){
        DB = val;
        render();
      }
    })
    .subscribe();
  liveListenerActive = true;
}
function stopLivePolling(){
  if(liveListenerActive && liveChannel){
    supabaseClient.removeChannel(liveChannel);
    liveListenerActive = false;
    liveChannel = null;
  }
}

/* ============================= FORECAST ============================= */
function computeForecast(days){
  const start = todayStr();
  const totalRooms = DB.rooms.length;
  const result = [];
  for(let i=0;i<days;i++){
    const d = addDays(start, i);
    let occRooms = 0;
    let revenue = 0;
    let roomRevenue = 0;
    DB.bookings.forEach(b=>{
      if(b.status==='checked_out') return;
      const covers = b.stayType==='dayuse' ? (d===b.checkIn) : (d>=b.checkIn && d<b.checkOut);
      if(!covers) return;
      occRooms++;
      revenue += b.roomRate;
      roomRevenue += b.roomRate;
      if(b.packageId && d===b.checkIn) revenue += (b.packagePrice||0);
      if(!b.packageId && b.breakfast) revenue += (DB.settings.breakfastPrice||0) * b.pax;
    });
    result.push({ date:d, occRooms, occPct: totalRooms ? Math.round((occRooms/totalRooms)*100) : 0, revenue, roomRevenue });
  }
  return result;
}

function toggleOooReason(selectId, wrapId){
  const val = document.getElementById(selectId).value;
  const needsReason = val==='ooo' || val==='hu';
  document.getElementById(wrapId).style.display = needsReason ? 'block' : 'none';
  const label = document.getElementById(wrapId).querySelector('label');
  if(label) label.textContent = val==='hu' ? 'Reason for House Use (required)' : 'Reason for Out of Order (required)';
}
function saveRoomHk(num){
  const val = document.getElementById('hkSelect').value;
  const r = room(num);
  if(val==='ooo' || val==='hu'){
    const reason = document.getElementById('hkOooReason').value.trim();
    if(!reason){ alert(val==='hu' ? 'Please enter a reason for marking this room House Use.' : 'Please enter a reason for marking this room Out of Order.'); return; }
    r.oooReason = reason;
  } else {
    r.oooReason = '';
  }
  r.hk = val;
  persist(); UI.modal=null; render();
}

/* ============================= CALENDAR ============================= */
function renderCalendar(){
  const start = addDays(todayStr(), UI.calOffset);
  const days = [];
  for(let i=0;i<14;i++) days.push(addDays(start,i));
  const t = todayStr();
  const colors = ['#2C6FBB','#4F9FD8','#5CA6A0','#8B6FBB','#C98A1E','#6B9E5C'];
  function colorFor(id){ let hh=0; for(const c of id) hh+=c.charCodeAt(0); return colors[hh%colors.length]; }

  return `
  <h2 class="page-title">${tr('cal_title')}</h2>
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn small secondary" onclick="UI.calOffset-=7;render()">${tr('btn_prev_week')}</button>
      <button class="btn small secondary" onclick="UI.calOffset=0;render()">${tr('btn_today')}</button>
      <button class="btn small secondary" onclick="UI.calOffset+=7;render()">${tr('btn_next_week')}</button>
    </div>
    <button class="btn" onclick="openNewBooking()">${tr('btn_new_booking')}</button>
  </div>
  <div class="card cal-wrap">
    <table class="cal-table">
      <thead>
        <tr><th style="position:sticky;left:0;background:var(--accent-soft);">${tr('col_room')}</th>${days.map(d=>`<th class="${d===t?'cal-today':''}">${fmtDate(d).split(' ').slice(0,2).join(' ')}</th>`).join('')}</tr>
      </thead>
      <tbody>
        ${DB.rooms.map(r=>{
          return `<tr><td class="roomcell">${r.number}<div class="muted" style="font-size:9.5px;font-weight:400;">${r.type}</div></td>${days.map(d=>{
            const b = DB.bookings.find(bk => bk.roomNumber===r.number && bk.status!=='reserved' ? false : false);
            const active = DB.bookings.find(bk => bk.roomNumber===r.number && bk.status!=='cancelled' && bk.status!=='no_show' && (bk.stayType==='dayuse' ? d===bk.checkIn : (d>=bk.checkIn && d<bk.checkOut)));
            const isToday = d===t;
            if(active){
              const g = guestById(active.guestId);
              const isFirst = d===active.checkIn;
              return `<td class="${isToday?'cal-today':''}">${isFirst? `<span class="cal-book" style="background:${colorFor(active.id)}" onclick="openBookingDetail('${active.id}')">${esc((g?g.name:'Guest').split(' ')[0])}</span>` : `<span class="cal-book" style="background:${colorFor(active.id)};opacity:.55;" onclick="openBookingDetail('${active.id}')">·</span>`}</td>`;
            }
            return `<td class="${isToday?'cal-today':''}"></td>`;
          }).join('')}</tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}

function saveEditBooking(bid){
  if(!UI.session || UI.session.role!=='manager') return;
  const b = bookingById(bid);
  const ci = document.getElementById('ebCheckIn').value;
  let co = document.getElementById('ebCheckOut').value;
  const stayType = document.getElementById('ebStayType').value;
  if(stayType==='dayuse') co = ci;
  else if(co<=ci){ alert('Check-out must be after check-in'); return; }
  const pkgId = document.getElementById('ebPackage').value;
  const pkg = pkgId ? packageById(pkgId) : null;

  b.pax = parseInt(document.getElementById('ebPax').value)||b.pax;
  b.stayType = stayType;
  b.checkIn = ci;
  b.checkOut = co;
  b.roomRate = parseInt(document.getElementById('ebRate').value)||b.roomRate;
  b.packageId = pkg ? pkg.id : null;
  b.packageName = pkg ? pkg.name : '';
  b.packagePrice = pkg ? pkg.price : 0;
  b.bookingSource = document.getElementById('ebSource').value;
  b.deposit = parseInt(document.getElementById('ebDeposit').value)||0;
  b.notes = document.getElementById('ebNotes').value.trim();
  b.editedBy = UI.session.name;
  b.editedAt = todayStr();
  logAudit('booking_edited', `Room ${b.roomNumber}: dates/rate/package/details updated.`);

  persist(); UI.modal=null; render();
}

function openMoveRoom(bid){
  const b = bookingById(bid);
  const g = guestById(b.guestId);
  const currentRoom = room(b.roomNumber);
  const eligible = DB.rooms.filter(r => r.number!==b.roomNumber && roomAvailableForRange(r.number, b.checkIn, b.checkOut, b.stayType, b.id));
  UI.modal = {
    title: `Move Room — ${esc(g?g.name:'Guest')}`,
    body: `
      <div class="notice">Currently in Room ${b.roomNumber} (${currentRoom?currentRoom.type:''}${currentRoom&&currentRoom.bedType?', '+esc(currentRoom.bedType):''}). Stay: ${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)}.</div>
      ${eligible.length ? `
        <div class="field"><label>Move to Room</label>
          <select id="mrRoom" onchange="mrSyncRate()">
            ${eligible.map(r=>`<option value="${r.number}" data-type="${r.type}">${r.number} — ${r.type}${r.bedType?' ('+esc(r.bedType)+')':''}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>New Room Rate</label><input type="number" id="mrRate" value="${b.roomRate}"></div>
        <div class="field"><label>Reason / Notes (optional)</label><textarea id="mrReason" rows="2" placeholder="e.g. guest requested quieter room, AC issue"></textarea></div>
      ` : `<div class="warn">No other rooms are free for this stay's dates (${fmtDate(b.checkIn)} \u2192 ${fmtDate(b.checkOut)}). Check the Room Board for availability.</div>`}
    `,
    actions: `<button class="btn ghost" onclick="closeModal()">Cancel</button>${eligible.length ? `<button class="btn" onclick="saveMoveRoom('${bid}')">Confirm Move</button>` : ''}`
  };
  render();
  if(eligible.length) setTimeout(mrSyncRate,0);

function mrSyncRate(){
  const sel = document.getElementById('mrRoom');
  if(!sel) return;
  const type = sel.options[sel.selectedIndex].dataset.type;
  document.getElementById('mrRate').value = rateFor(type);
}
function saveMoveRoom(bid){
  const b = bookingById(bid);
  const oldRoom = b.roomNumber;
  const newRoom = document.getElementById('mrRoom').value;
  const newRate = parseInt(document.getElementById('mrRate').value)||b.roomRate;
  const reason = document.getElementById('mrReason').value.trim();
  const wasOccupied = b.status==='checked_in';

  b.roomNumber = newRoom;
  b.roomRate = newRate;
  const staffName = UI.session ? UI.session.name : 'Staff';
  const moveNote = `Moved from Room ${oldRoom} to Room ${newRoom} on ${fmtDate(todayStr())} by ${staffName}.${reason ? ' Reason: '+reason : ''}`;
  b.notes = b.notes ? b.notes + ' — ' + moveNote : moveNote;

  if(wasOccupied){
    const old = room(oldRoom);
    if(old){ old.hk = 'dirty'; }
  }

  persist(); UI.modal=null; render();
}

function nbSyncRate(){
  const sel = document.getElementById('nbRoom');
  const type = sel.options[sel.selectedIndex].dataset.type;
  const isDayUse = document.getElementById('nbStayType').value==='dayuse';
  document.getElementById('nbRate').value = isDayUse ? dayUseRateFor(type) : rateFor(type);
}
function nbStayTypeChange(){
  const isDayUse = document.getElementById('nbStayType').value==='dayuse';
  const co = document.getElementById('nbCheckOut');
  const coLabel = document.getElementById('nbCheckOutLabel');
  const rateLabel = document.getElementById('nbRateLabel');
  if(isDayUse){
    co.value = document.getElementById('nbCheckIn').value;
    co.disabled = true;
    coLabel.textContent = 'Check-out (same day)';
    rateLabel.textContent = 'Day Use Rate';
  } else {
    co.disabled = false;
    if(co.value <= document.getElementById('nbCheckIn').value) co.value = addDays(document.getElementById('nbCheckIn').value,1);
    coLabel.textContent = 'Check-out';
    rateLabel.textContent = 'Room Rate / night';
  }
  nbSyncRate();
}
function nbSyncCheckout(){
  if(document.getElementById('nbStayType').value==='dayuse'){
    document.getElementById('nbCheckOut').value = document.getElementById('nbCheckIn').value;
  }
}
function nbToggleGuest(){

}
function saveNewBooking(){
  const roomNum = document.getElementById('nbRoom').value;
  const pax = parseInt(document.getElementById('nbPax').value)||1;
  const guestSel = document.getElementById('nbGuestSelect').value;
  let guestId = guestSel;
  if(guestSel==='__new'){
    const name = document.getElementById('nbName').value.trim();
    if(!name){ alert('Please enter guest name'); return; }
    const newG = {id:uid('g'), name, phone:document.getElementById('nbPhone').value.trim(), origin:document.getElementById('nbOrigin').value, email:document.getElementById('nbEmail').value.trim(), idNumber:'', idType:'', address:'', city:'', vehicleNo:'', emergencyContact:'', notes:''};
    DB.guests.push(newG);
    guestId = newG.id;
  }
  const stayType = document.getElementById('nbStayType').value;
  const ci = document.getElementById('nbCheckIn').value;
  let co = document.getElementById('nbCheckOut').value;
  if(stayType==='dayuse'){
    co = ci;
  } else if(co<=ci){
    alert('Check-out must be after check-in'); return;
  }
  const pkgId = document.getElementById('nbPackage').value;
  const pkg = pkgId ? packageById(pkgId) : null;
  const b = {
    id:uid('bk'), roomNumber:roomNum, guestId, pax,
    checkIn:ci, checkOut:co, status:'reserved', stayType,
    roomRate: parseInt(document.getElementById('nbRate').value)||0,
    packageId: pkg ? pkg.id : null,
    packageName: pkg ? pkg.name : '',
    packagePrice: pkg ? pkg.price : 0,
    breakfast: !!pkg,
    bookingSource: document.getElementById('nbSource').value,
    deposit: parseInt(document.getElementById('nbDeposit').value)||0,
    charges:[], paid:false,
    notes: document.getElementById('nbNotes').value.trim()
  };
  DB.bookings.push(b);
  persist(); UI.modal=null; render();
}

function saveFolioOverride(bid){
  if(!UI.session || UI.session.role!=='manager') return;
  const b = bookingById(bid);
  const oldRate = b.roomRate, oldDeposit = b.deposit, oldPkg = b.packagePrice;
  b.roomRate = parseInt(document.getElementById('foRoomRate').value)||b.roomRate;
  b.deposit = parseInt(document.getElementById('foDeposit').value)||0;
  const pkgEl = document.getElementById('foPackagePrice');
  if(pkgEl) b.packagePrice = parseInt(pkgEl.value)||b.packagePrice;
  logAudit('folio_override', `Room ${b.roomNumber}: rate ${money(oldRate)}\u2192${money(b.roomRate)}, deposit ${money(oldDeposit||0)}\u2192${money(b.deposit)}${pkgEl?`, package ${money(oldPkg)}\u2192${money(b.packagePrice)}`:''}`);
  persist();
  openBillingFolio(bid);
}
function openEditCharge(bid, chargeId){

  if(!c) return;
  UI.modal = {

    body:`
      <div class="notice">Corrections don't erase history — this reverses the original entry and posts a new corrected one, both staying visible on the folio.</div>
      <div class="field"><label>Original</label>${esc(c.desc)} ${c.qty>1?'x'+c.qty:''} — ${money(c.amount*c.qty)}</div>
      <div class="field"><label>Corrected Description</label><input type="text" id="ecDesc" value="${esc(c.desc)}"></div>
      <div class="row2">
        <div class="field"><label>Corrected Amount</label><input type="number" id="ecAmount" value="${c.amount}"></div>
        <div class="field"><label>Corrected Qty</label><input type="number" id="ecQty" value="${c.qty}" min="1"></div>
      </div>
      <div class="field"><label>Reason (required)</label><textarea id="ecReason" rows="2" placeholder="e.g. wrong amount entered"></textarea></div>
      <div class="small muted">Originally posted by ${esc(c.postedBy||'—')} on ${fmtDate(c.date)}.</div>
    `,
    actions:`<button class="btn ghost" onclick="openBillingFolio('${bid}')">Cancel</button><button class="btn" onclick="saveEditCharge('${bid}','${chargeId}')">Post Correction</button>`
  };

function saveEditCharge(bid, chargeId){
  if(!UI.session || UI.session.role!=='manager') return;
  const b = bookingById(bid);
  const c = (b.charges||[]).find(ch=>ch.id===chargeId);
  if(!c) return;
  const reason = document.getElementById('ecReason').value.trim();
  if(!reason){ alert('Please enter a reason for this correction.'); return; }
  const newDesc = document.getElementById('ecDesc').value.trim() || c.desc;
  const newAmount = parseInt(document.getElementById('ecAmount').value)||c.amount;
  const newQty = parseInt(document.getElementById('ecQty').value)||c.qty;
  b.charges.push({ id: uid('ch'), desc:`Reversal: ${c.desc}`, amount:-c.amount, qty:c.qty, date:todayStr(), postedBy:UI.session.name, reversalOf:c.id, reason });
  b.charges.push({ id: uid('ch'), desc:newDesc, amount:newAmount, qty:newQty, date:todayStr(), postedBy:UI.session.name, correctionOf:c.id, reason });
  logAudit('charge_corrected', `Room ${b.roomNumber}: "${c.desc}" (${money(c.amount*c.qty)}) \u2192 "${newDesc}" (${money(newAmount*newQty)}). Reason: ${reason}`);
  persist();
  openBillingFolio(bid);
}
function openReverseCharge(bid, chargeId){
  if(!UI.session || UI.session.role!=='manager') return;
  const b = bookingById(bid);
  const c = (b.charges||[]).find(ch=>ch.id===chargeId);
  if(!c) return;
  UI.modal = {
    title:'Reverse Charge',
    body:`
      <div class="notice">This won't delete the original entry — it adds a matching reversal so the folio history stays complete and auditable.</div>

    `,
    actions:`<button class="btn ghost" onclick="openBillingFolio('${bid}')">Cancel</button><button class="btn danger" onclick="saveReverseCharge('${bid}','${chargeId}')">Confirm Reversal</button>`
  };

}
function saveReverseCharge(bid, chargeId){
  if(!UI.session || UI.session.role!=='manager') return;
  const b = bookingById(bid);
  const c = (b.charges||[]).find(ch=>ch.id===chargeId);
  if(!c) return;
  const reason = document.getElementById('rvReason').value.trim();
  if(!reason){ alert('Please enter a reason for this reversal.'); return; }
  b.charges.push({ id: uid('ch'), desc:`Reversal: ${c.desc}`, amount:-c.amount, qty:c.qty, date:todayStr(), postedBy:UI.session.name, reversalOf:c.id, reason });
  logAudit('charge_reversed', `Room ${b.roomNumber}: reversed "${c.desc}" (${money(c.amount*c.qty)}). Reason: ${reason}`);
  persist();
  openBillingFolio(bid);
}
function addCharge(bid){
  const b = bookingById(bid);
  const cat = document.getElementById('fcCategory').value;
  const amount = parseInt(document.getElementById('fcAmount').value)||0;
  const desc = document.getElementById('fcDesc').value.trim() || cat;
  const qty = parseInt(document.getElementById('fcQty').value)||1;
  if(amount<=0){ alert('Enter a valid amount'); return; }
  b.charges = b.charges || [];
  b.charges.push({id:uid('ch'), desc:`${cat}: ${desc}`, amount, qty, date:todayStr(), postedBy: UI.session ? UI.session.name : 'Unknown'});
  persist();
  openBillingFolio(bid);
}

      </tr>`).join('') : `<tr class="empty-row"><td colspan="4">No rooms currently being cleaned</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="card" style="margin-top:14px;">
    <strong style="color:var(--navy);font-size:13.5px;">Ready for Inspection</strong>
    <table style="margin-top:8px;">
      <thead><tr><th>${tr('col_room')}</th><th>Cleaned By</th><th>Finished</th><th></th></tr></thead>
      <tbody>
      ${inspect.length ? inspect.map(r=>`<tr>
        <td><strong>${r.number}</strong></td><td>${esc(r.cleaningStaff||'—')}</td><td class="small muted">${r.cleaningFinishedAt||'—'}</td>
        <td><button class="btn small" onclick="approveClean('${r.number}')">Approve — Mark Clean</button> <button class="btn small ghost" onclick="startCleaning('${r.number}')">Send Back</button></td>
      </tr>`).join('') : `<tr class="empty-row"><td colspan="4">No rooms awaiting inspection</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="card" style="margin-top:14px;">
    <strong style="color:var(--navy);font-size:13.5px;">Out of Order &amp; House Use</strong>
    <table style="margin-top:8px;">
      <thead><tr><th>${tr('col_room')}</th><th>${tr('col_type')}</th><th>${tr('col_status')}</th><th>${tr('col_reason')}</th><th></th></tr></thead>
      <tbody>
      ${ooo.concat(hu).length ? ooo.concat(hu).map(r=>`<tr>
          <td><strong>${r.number}</strong></td><td>${r.type}</td>

      }).join('')}
    </div>
  </div>
  `;
}
function startCleaning(num){
  const r = room(num);
  r.hk = 'in_progress';
  r.cleaningStaff = UI.session ? UI.session.name : 'Unknown';
  r.cleaningStartedAt = fmtDate(todayStr())+' '+nowTimeStr();
  r.cleaningFinishedAt = '';
  persist(); render();
}
function markReadyForInspection(num){
  const r = room(num);
  r.hk = 'inspect';
  r.cleaningFinishedAt = fmtDate(todayStr())+' '+nowTimeStr();
  persist(); render();
}
function approveClean(num){
  const r = room(num);
  r.hk = 'clean';
  r.inspectedBy = UI.session ? UI.session.name : 'Unknown';
  r.inspectedAt = fmtDate(todayStr())+' '+nowTimeStr();

function markClean(num){
  const r = room(num);
  r.hk = 'clean';
  r.oooReason = '';
  r.cleaningStaff=''; r.cleaningStartedAt=''; r.cleaningFinishedAt='';
  persist(); render();
}

function saveAddRoom(){
  const number = document.getElementById('arNumber').value.trim();
  if(!number){ alert('Enter a room number'); return; }
  if(DB.rooms.some(r=>r.number===number)){ alert('A room with that number already exists'); return; }
  const hk = document.getElementById('arHk').value;
  let oooReason = '';
  if(hk==='ooo' || hk==='hu'){
    oooReason = document.getElementById('arOooReason').value.trim();
    if(!oooReason){ alert(hk==='hu' ? 'Please enter a reason for marking this room House Use.' : 'Please enter a reason for marking this room Out of Order.'); return; }
  }
  DB.rooms.push({
    number,
    floor: parseInt(document.getElementById('arFloor').value)||1,
    type: document.getElementById('arType').value,
    bedType: document.getElementById('arBedType').value,
    hk, oooReason
  });
  persist(); UI.modal=null; render();
}

function saveEditRoom(oldNum){
  const r = room(oldNum);
  const newNum = document.getElementById('erNumber').value.trim();
  if(!newNum){ alert('Room number cannot be empty'); return; }
  if(newNum!==oldNum && DB.rooms.some(rm=>rm.number===newNum)){ alert('A room with that number already exists'); return; }
  if(newNum!==oldNum){
    DB.bookings.forEach(b=>{ if(b.roomNumber===oldNum) b.roomNumber=newNum; });
  }
  r.number = newNum;
  r.floor = parseInt(document.getElementById('erFloor').value)||r.floor;
  r.type = document.getElementById('erType').value;
  r.bedType = document.getElementById('erBedType').value;
  persist(); UI.modal=null; render();
}
function deleteRoom(num){
  if(DB.bookings.some(b=>b.roomNumber===num && b.status!=='checked_out' && b.status!=='cancelled' && b.status!=='no_show')) return;
  if(!confirm(`Delete room ${num}? This cannot be undone.`)) return;
  DB.rooms = DB.rooms.filter(r=>r.number!==num);
  logAudit('room_deleted', `Deleted room ${num}.`);
  persist(); UI.modal=null; render();
}

function startOfMonth(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01'; }

function computeRevenueLines(startDate, endDate){
  const lines = [];
  DB.bookings.forEach(b=>{
    const g = guestById(b.guestId);
    const guestName = g ? g.name : '—';
    const r = room(b.roomNumber);
    const daysToCount = b.stayType==='dayuse' ? [b.checkIn] : (()=>{ const arr=[]; let d=b.checkIn; while(d<b.checkOut){ arr.push(d); d=addDays(d,1); } return arr; })();
    daysToCount.forEach(d=>{
      if(d >= startDate && d <= endDate){
        lines.push({date:d, room:b.roomNumber, guest:guestName, category: b.stayType==='dayuse' ? 'Room (Day Use)' : 'Room', description:(r?r.type:'')+(b.stayType==='dayuse'?' day-use charge':' room charge'), amount:b.roomRate});
        if(!b.packageId && b.breakfast){
          lines.push({date:d, room:b.roomNumber, guest:guestName, category:'Breakfast', description:'Breakfast add-on', amount:DB.settings.breakfastPrice*b.pax});
        }
      }
    });
    if(b.packageId && b.checkIn>=startDate && b.checkIn<=endDate){
      lines.push({date:b.checkIn, room:b.roomNumber, guest:guestName, category:'Package', description:b.packageName, amount:b.packagePrice});
    }
    (b.charges||[]).forEach(c=>{
      if(c.date>=startDate && c.date<=endDate){
        const cat = c.desc.includes(':') ? c.desc.split(':')[0].trim() : 'Other';
        lines.push({date:c.date, room:b.roomNumber, guest:guestName, category:cat, description:c.desc, amount:c.amount*c.qty});
      }
    });
  });
  lines.sort((a,b)=>a.date.localeCompare(b.date));
  return lines;
}

function exportRevenueExcel(){
  const start = document.getElementById('repStart').value;
  const end = document.getElementById('repEnd').value;
  if(!start || !end || end<start){ alert('Please choose a valid date range.'); return; }
  if(typeof XLSX === 'undefined'){ alert('The Excel export library did not load. Check your internet connection and try again.'); return; }

  const lines = computeRevenueLines(start, end);
  const catTotals = {};
  lines.forEach(l=>{ catTotals[l.category] = (catTotals[l.category]||0) + l.amount; });
  const grandTotal = lines.reduce((s,l)=>s+l.amount,0);

  const summaryRows = [
    [DB.settings.hotelName + ' — Revenue Summary'],
    ['Period: '+fmtDate(start)+' to '+fmtDate(end)],
    ['Generated: '+fmtDate(todayStr())],
    [],
    ['Category','Amount (IDR)']
  ];
  Object.keys(catTotals).sort().forEach(cat=>{ summaryRows.push([cat, catTotals[cat]]); });
  summaryRows.push([]);
  summaryRows.push(['Total Revenue', grandTotal]);
  summaryRows.push([]);
  summaryRows.push(['Note: this covers revenue transactions only. A full balance sheet also needs cash/bank balances, receivables, fixed assets, and liabilities from your accounting records.']);

  const txRows = [['Date','Room','Guest','Category','Description','Amount (IDR)']];
  lines.forEach(l=> txRows.push([l.date, l.room, l.guest, l.category, l.description, l.amount]));

  const wb = XLSX.utils.book_new();
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols'] = [{wch:30},{wch:18}];
  const wsTx = XLSX.utils.aoa_to_sheet(txRows);
  wsTx['!cols'] = [{wch:12},{wch:8},{wch:22},{wch:14},{wch:32},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
  XLSX.utils.book_append_sheet(wb, wsTx, 'Transactions');
  XLSX.writeFile(wb, `HashInnMarina-Revenue-${start}_to_${end}.xlsx`);
}

function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hash-inn-marina-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data.rooms || !data.bookings || !data.guests || !data.settings){
        alert('This file does not look like a valid Hash Inn Marina backup.');
        return;
      }
      if(!confirm('This will replace all current data with the contents of this backup. Continue?')) return;
      DB = data;
      const ok = await persist();
      if(ok){
        alert('Backup restored and saved successfully.');
      } else {
        alert('The backup loaded, but saving it to storage failed (likely a connection issue). It is showing on your screen now, but is NOT safely saved yet — click "Retry Save" in the red banner at the top before doing anything else, or reloading the page could lose it.');
      }
      render();
    }catch(err){
      alert('Could not read this file. Make sure it is a valid backup .json file.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}
