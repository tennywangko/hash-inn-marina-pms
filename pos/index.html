<style>
:root{
  --navy:#0B2A4A; --navy-2:#123A63; --navy-3:#1B4B7C; --accent:#4F9FD8; --accent-soft:#E9F3FB;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{min-height:100%;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:13px}
.brand h1{font-size:15px;margin:0}
.brand span{font-size:11px;color:#BFD9F0}
.hdr-right{display:flex;align-items:center;gap:8px;font-size:12px;color:#BFD9F0}
.hdr-right button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:8px;font-size:12px}
nav{background:var(--navy-2);display:flex;gap:2px;padding:0 10px;overflow-x:auto;position:sticky;top:0;z-index:40}
nav button{background:transparent;border:none;color:#CFE1F2;padding:12px 14px;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:#fff;border-bottom-color:var(--accent);font-weight:600}
nav .badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:4px}
main{flex:1;padding:14px 16px 70px;max-width:1400px;width:100%;margin:0 auto}
h2{font-size:17px;margin:2px 0 12px;color:var(--navy)}
h3{font-size:14px;margin:0 0 8px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.muted{color:var(--muted)} .small{font-size:12px} .right{text-align:right} .bold{font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:10px 14px;border-radius:8px;font-weight:600;min-height:42px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#06203a}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.amber{background:var(--amber-soft);color:var(--amber)}

@media print{
  body{background:#fff}

  @page{margin:0}
}
</style>

/* ============================= DATA LAYER ============================= */
async function ensureAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ const { error } = await sb.auth.signInAnonymously(); if(error) throw error; }
}
const db = {
  async list(table, f, order){
    let q = sb.from(table).select('*');
    for(const [k,v] of Object.entries(f||{})) q = Array.isArray(v) ? q.in(k,v) : q.eq(k,v);
    if(order) q = q.order(order[0], { ascending: order[1]!==false });
    const { data, error } = await q; if(error) throw error; return data||[];
  },
  async listIn(table, col, ids, f){
    let out=[]; for(let i=0;i<ids.length;i+=40) out = out.concat(await db.list(table, Object.assign({[col]:ids.slice(i,i+40)}, f||{})));
    return out;
  },
  async insert(table, rows){ const { data, error } = await sb.from(table).insert(rows).select(); if(error) throw error; return data||[]; },
  async update(table, id, patch){ const { data, error } = await sb.from(table).update(patch).eq('id', id).select(); if(error) throw error; return (data||[])[0]; },
  async remove(table, id){ const { error } = await sb.from(table).delete().eq('id', id); if(error) throw error; },
  async claimTicket(id){ const { data, error } = await sb.from('pos_tickets').update({ printed_at:new Date().toISOString() }).eq('id', id).is('printed_at', null).select(); if(error) throw error; return (data||[]).length>0; },
  async rpc(fn, args){ const { data, error } = await sb.rpc(fn, args||{}); if(error) throw error; return data; }
};

    db.list('pos_items', { outlet_id:OUTLET_ID }, ['sort']), db.list('pos_tables', { outlet_id:OUTLET_ID }, ['sort'])
  ]);
  S.outlet = o[0]; S.cats = c; S.items = i; S.tables = tb;
}
let refreshing = false, refreshAgain = false;

  try{

      db.list('pos_orders', { outlet_id:OUTLET_ID, status:'open' }, ['opened_at']),
      db.list('pos_tickets', { outlet_id:OUTLET_ID, status:['new','ready'] }, ['created_at']),
      db.list('pos_shifts', { outlet_id:OUTLET_ID }, ['opened_at', false]),
      db.list('pos_orders', { outlet_id:OUTLET_ID, business_date:bizDate() }, ['opened_at', false])
    ]);
    const tOrderIds = [...new Set(tickets.map(x=>x.order_id))];
    const ids = [...new Set(open.map(o=>o.id).concat(tOrderIds))];
    const [oi, pays] = await Promise.all([ ids.length?db.listIn('pos_order_items','order_id',ids):[], open.length?db.listIn('pos_payments','order_id',open.map(o=>o.id)):[] ]);
    const known = new Map(open.concat(today).map(o=>[o.id,o]));
    const missing = tOrderIds.filter(id=>!known.has(id));
    if(missing.length) (await db.listIn('pos_orders','id',missing)).forEach(o=>known.set(o.id,o));
    S.orders = open; S.tickets = tickets; S.oitems = oi; S.payments = pays; S.orderMap = known;
    S.closed = today.filter(o=>o.status!=='open');
    S.shift = shifts.find(s=>!s.closed_at) || null;
    S.offline = false;
    if(S.sel && S.selData && S.orders.find(o=>o.id===S.sel)) await loadSel(S.sel, true);
    softRender();
    autoPrintKitchen();
  }catch(e){ console.error(e); S.offline = true; softRender(); }
  finally{ refreshing = false; if(refreshAgain){ refreshAgain=false; refreshLive(); } }
}
let rtTimer=null, channel=null, pollTimer=null, recTimer=null;
function startLive(){
  if(channel) return;
  const bump = () => { clearTimeout(rtTimer); rtTimer = setTimeout(refreshLive, 350); };
  channel = sb.channel('pos_live')
    .on('postgres_changes', { event:'*', schema:'public', table:'pos_tickets' }, bump)
    .on('postgres_changes', { event:'*', schema:'public', table:'pos_orders' }, bump)
    .on('postgres_changes', { event:'*', schema:'public', table:'pos_order_items' }, bump)
    .subscribe();
  pollTimer = setInterval(refreshLive, 15000);
  recTimer = setInterval(reconcile, 5*60000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshLive(); });
}
function stopLive(){ if(channel){ sb.removeChannel(channel); channel=null; } clearInterval(pollTimer); clearInterval(recTimer); }

/* ============================= TOTALS ============================= */
function calcTotals(items, discount){
  const subtotal = items.filter(i=>!i.voided).reduce((s,i)=>s+i.price*i.qty,0);
  const disc = Math.min(Math.max(discount||0,0), subtotal);
  const rate = Number(S.outlet.tax_rate)||0;
  let tax, total;
  if(S.outlet.tax_inclusive){ total = subtotal-disc; tax = Math.round(total*rate/(100+rate)); }
  else { tax = Math.round((subtotal-disc)*rate/100); total = subtotal-disc+tax; }
  return { subtotal, discount:disc, tax, total };
}
const itemsOf = id => S.oitems.filter(i=>i.order_id===id);
const paidOf = id => S.payments.filter(p=>p.order_id===id && !p.voided).reduce((s,p)=>s+p.amount,0);
async function saveTotals(orderId, discount, extra){
  const its = await db.list('pos_order_items', { order_id:orderId });
  const o = S.orders.find(x=>x.id===orderId) || (S.selData && S.selData.order);
  const tt = calcTotals(its, discount==null ? (o?o.discount:0) : discount);
  return db.update('pos_orders', orderId, Object.assign(tt, extra||{}));
}

      : f.type==='textarea' ? `<textarea id="m_${f.id}" rows="${f.rows||6}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`

    </div></div>`;
  const first = bg.querySelector('input,select,textarea'); if(first && !c.noFocus) setTimeout(()=>first.focus(), 30);

function okModal(){
  const c = S.modal.cfg, out = {};

}

async function openShift(){

  try{ await db.insert('pos_shifts', [{ outlet_id:OUTLET_ID, opened_by:S.session.name, opening_cash:Math.max(0,r.cash) }]); await refreshLive(); render(); }catch(e){ fail(e); }

async function closeShift(){
  try{
    const pays = await db.list('pos_payments', { shift_id:S.shift.id });
    const cash = pays.filter(p=>!p.voided && p.method==='Cash').reduce((s,p)=>s+p.amount,0);
    const expected = S.shift.opening_cash + cash;
    const by = {}; pays.filter(p=>!p.voided).forEach(p=>by[p.method]=(by[p.method]||0)+p.amount);
    const r = await ask({ title:t('close_shift'), html:`<table class="t">${Object.entries(by).map(([m,a])=>`<tr><td>${esc(m)}</td><td class="right">${money(a)}</td></tr>`).join('')}
      <tr><td>${t('opening_cash')}</td><td class="right">${money(S.shift.opening_cash)}</td></tr><tr><td><b>${t('expected_cash')}</b></td><td class="right"><b>${money(expected)}</b></td></tr></table>
      ${S.orders.length?`<div class="banner" style="margin-top:8px">${t('open_bills')}: ${S.orders.length}</div>`:''}`,
      fields:[{ id:'counted', label:t('counted_cash'), type:'number', value:'' }, { id:'note', label:t('note'), value:'' }] });
    if(!r) return;
    const sh = await db.update('pos_shifts', S.shift.id, { closed_by:S.session.name, closed_at:new Date().toISOString(), expected_cash:expected, counted_cash:r.counted, note:r.note });
    await refreshLive(); render();
    await printHTML(shiftHTML(sh, by));
  }catch(e){ fail(e); }
}
async function takePayment(method){
  const { order:o, payments } = S.selData; const due = o.total - payments.filter(p=>!p.voided).reduce((s,p)=>s+p.amount,0);
  const isCash = method==='Cash', isCredit = method==='Piutang';
  if(isCredit){ const by = await managerApproval(); if(!by) return; }
  const r = await ask({ title:(isCash?t('cash'):method)+' · '+t('due')+' '+money(due),
    html: isCash?`<div class="row" style="margin-bottom:4px">${[due, ...[20000,50000,100000,150000,200000].filter(v=>v>due)].slice(0,5).map((v,i)=>`<button class="btn sm" onclick="document.getElementById('m_tendered').value=${v}">${i===0?t('exact'):num(v)}</button>`).join('')}</div>`:'',
    fields: isCash ? [{ id:'tendered', label:t('tendered'), type:'number', value:due }] : [{ id:'amount', label:t('amount'), type:'number', value:due }, { id:'ref', label:isCredit?t('credit_name'):t('ref'), value:'' }] });
  if(!r) return;
  if(isCredit && !r.ref){ toast(t('credit_name')+'?', true); return; }
  let amount, tendered=null, change=null;
  if(isCash){ if(r.tendered<=0) return; tendered=r.tendered; amount=Math.min(tendered,due); change=tendered-amount; }
  else { amount = r.amount; if(amount<=0 || amount>due){ toast(t('amount')+'?', true); return; } }
  try{
    await db.insert('pos_payments', [{ order_id:o.id, outlet_id:OUTLET_ID, business_date:bizDate(), shift_id:S.shift.id, method, amount, tendered, change, ref:r.ref||'', received_by:S.session.name }]);
    await afterPayment(o, due-amount, change);
  }catch(e){ fail(e); }
}
async function afterPayment(o, remaining, change){
  if(remaining<=0) await db.update('pos_orders', o.id, { status:'paid', closed_by:S.session.name, closed_at:new Date().toISOString() });
  await loadSel(o.id, true); await refreshLive(); render();
  if(remaining<=0){ toast(t('bill_paid')+(change?` · ${t('change')} ${money(change)}`:'')); if(S.dev.autoReceipt) await printBill(true); }
}

async function chargeRoom(){
  const { order:o, payments } = S.selData; const due = o.total - payments.filter(p=>!p.voided).reduce((s,p)=>s+p.amount,0);
  const g = await pickGuest(); if(!g) return;
  const r = await ask({ title:t('charge_room')+' '+g.room, html:`<div><b>${esc(g.guest)}</b></div><div class="muted small">${esc(o.order_no)} · ${esc(typeLabel(o))}</div>`, fields:[{ id:'amount', label:t('amount'), type:'number', value:due }] });
  if(!r) return; if(r.amount<=0 || r.amount>due){ toast(t('amount')+'?', true); return; }
  try{
    const res = await db.rpc('pos_post_room_charge', { p_order_id:o.id, p_booking_id:g.booking_id, p_amount:r.amount, p_staff:S.session.name, p_shift_id:S.shift?S.shift.id:null });
    toast(`${t('room_ok')} ${res.room}`);
    await loadSel(o.id, true); await refreshLive(); render();
    if(res.paid_in_full && S.dev.autoReceipt) await printBill(true);
  }catch(e){ fail(e); }

async function reversePayment(id){
  const p = S.selData.payments.find(x=>x.id===id); if(!p) return;
  const by = await managerApproval(); if(!by) return;
  const r = await ask({ title:t('reverse')+' · '+p.method+' '+money(p.amount), fields:[{ id:'reason', label:t('reason'), value:'' }] }); if(!r || !r.reason){ if(r) toast(t('reason')+'?', true); return; }
  try{
    if(p.method==='Room'){
      const rc = S.selData.roomCharges.find(x=>x.payment_id===id);
      await db.rpc('pos_reverse_room_charge', { p_charge_id:rc.id, p_reason:r.reason, p_staff:by });
    } else {
      await db.update('pos_payments', id, { voided:true, void_reason:r.reason+' ('+by+')' });
      if(S.selData.order.status==='paid') await db.update('pos_orders', S.selData.order.id, { status:'open', closed_by:null, closed_at:null });
    }
    await loadSel(S.sel, true); await refreshLive(); render();
  }catch(e){ fail(e); }
}
async function voidItem(id){
  const it = S.selData.items.find(x=>x.id===id); if(!it) return;
  const by = await managerApproval(); if(!by) return;
  const r = await ask({ title:t('void_item')+' · '+it.qty+' × '+it.name, fields:[{ id:'reason', label:t('reason'), value:'' }] }); if(!r || !r.reason){ if(r) toast(t('reason')+'?', true); return; }
  try{
    await db.update('pos_order_items', id, { voided:true, void_reason:r.reason, voided_by:by });
    const o = await saveTotals(S.sel);
    const paid = S.selData.payments.filter(p=>!p.voided).reduce((s,p)=>s+p.amount,0);
    if(paid>0 && paid>=o.total) await db.update('pos_orders', o.id, { status:'paid', closed_by:S.session.name, closed_at:new Date().toISOString() });
    await loadSel(S.sel, true); await refreshLive(); render();
  }catch(e){ fail(e); }
}
async function voidOrder(){
  const { order:o, payments } = S.selData;
  if(payments.some(p=>!p.voided)){ toast(t('has_payments'), true); return; }
  const by = await managerApproval(); if(!by) return;
  const r = await ask({ title:t('void_order')+' · '+o.order_no, fields:[{ id:'reason', label:t('reason'), value:'' }] }); if(!r || !r.reason){ if(r) toast(t('reason')+'?', true); return; }
  try{
    await db.update('pos_orders', o.id, { status:'void', void_reason:r.reason, closed_by:by, closed_at:new Date().toISOString() });
    for(const tk of S.tickets.filter(x=>x.order_id===o.id)) await db.update('pos_tickets', tk.id, { status:'done' });
    await loadSel(o.id, true); await refreshLive(); render();
  }catch(e){ fail(e); }
}
async function setDiscount(){
  const o = S.selData.order;
  const by = await managerApproval(); if(!by) return;
  const r = await ask({ title:t('discount'), fields:[{ id:'kind', label:t('type'), type:'select', value:'rp', options:[['rp',t('rupiah')],['pct',t('percent')]] }, { id:'val', label:t('amount'), type:'number', value:o.discount||0 }, { id:'note', label:t('reason'), value:o.discount_note||'' }] });
  if(!r) return;
  const disc = r.kind==='pct' ? Math.round(o.subtotal*Math.min(r.val,100)/100) : r.val;
  try{ await saveTotals(o.id, disc, { discount_note:(r.note||'')+(r.note?' · ':'')+by }); await loadSel(o.id, true); await refreshLive(); render(); }catch(e){ fail(e); }
}

function exportCSV(){
  const r = S.rep; if(!r) return;
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows = [];
  const sec = (title, cols, data) => { rows.push([title]); rows.push(cols); data.forEach(d=>rows.push(d)); rows.push([]); };
  const s = r.summary;
  sec(`${S.outlet.name} — ${r.from} to ${r.to}`, ['Bills','Guests','Gross','Discount','Total','Tax portion','Net of tax'], [[s.bills,s.pax,s.gross,s.discount,s.total,s.tax,s.total-s.tax]]);
  sec('By payment method', ['Method','Count','Amount'], r.by_method.map(m=>[m.method,m.count,m.amount]));
  sec('By category', ['Category','Qty','Amount'], r.by_category.map(m=>[m.category,m.qty,m.amount]));
  sec('Items sold', ['Item','Category','Qty','Amount'], r.by_item.map(m=>[m.name,m.category,m.qty,m.amount]));
  sec('Room charges', ['Bill','Room','Guest','Amount','Status','By'], r.room_charges.map(m=>[m.order_no,m.room,m.guest,m.amount,m.status,m.by]));
  sec('Voided bills', ['Bill','Total','Reason','By'], r.void_orders.map(m=>[m.order_no,m.total,m.reason,m.by]));
  sec('Voided items', ['Bill','Item','Qty','Amount','Reason','By'], r.void_items.map(m=>[m.order_no,m.name,m.qty,m.amount,m.reason,m.by]));
  sec('Shifts', ['Opened by','Opened at','Opening cash','Closed by','Closed at','Expected cash','Counted cash','Note'], r.shifts.map(x=>[x.opened_by,x.opened_at,x.opening_cash,x.closed_by,x.closed_at,x.expected_cash,x.counted_cash,x.note]));
  sec('Bills', ['Bill','Date','Type','Table','Room','Guests','Subtotal','Discount','Tax','Total','Status','Methods','Opened by','Closed by'], r.bills.map(b=>[b.order_no,b.date,b.type,b.table,b.room,b.pax,b.subtotal,b.discount,b.tax,b.total,b.status,b.methods,b.opened_by,b.closed_by]));
  const csv = '﻿' + rows.map(row=>row.map(q).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `marina-restaurant-${r.from}${r.to!==r.from?'_'+r.to:''}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

/* ----------------------------- MENU ----------------------------- */
function renderMenu(){
  const m = isMgr();
  return `<div class="spread" style="margin-bottom:10px;flex-wrap:wrap"><h2 style="margin:0">${t('menu')}</h2>${m?`<div class="row"><button class="btn sm primary" onclick="editCat()">＋ ${t('add_category')}</button><button class="btn sm primary" onclick="editItem()">＋ ${t('add_item')}</button><button class="btn sm" onclick="importMenu()">${t('import_menu')}</button></div>`:''}</div>
  ${!S.cats.length?`<div class="card muted">${t('empty_menu')}</div>`:''}
  ${S.cats.map(c=>`<div class="card" style="margin-bottom:10px"><div class="spread"><h3 style="margin:0">${esc(c.name)}${c.name_id?` <span class="muted">/ ${esc(c.name_id)}</span>`:''} <span class="pill ${c.station==='bar'?'blue':'gray'}">${c.station==='bar'?t('bar'):t('kitchen_st')}</span></h3>${m?`<button class="btn sm" onclick="editCat('${c.id}')">${t('edit')}</button>`:''}</div>
    <table class="t" style="margin-top:6px"><tbody>${S.items.filter(i=>i.active && i.category_id===c.id).map(i=>`<tr><td>${esc(i.name)}${i.name_id?`<div class="small muted">${esc(i.name_id)}</div>`:''}</td><td class="right">${money(i.price)}</td>
      <td class="right" style="white-space:nowrap"><button class="btn sm ${i.sold_out?'danger':''}" onclick="toggleSoldOut('${i.id}')">${i.sold_out?t('sold_out'):t('available')}</button>${m?` <button class="btn sm" onclick="editItem('${i.id}')">${t('edit')}</button>`:''}</td></tr>`).join('')||`<tr><td class="muted">—</td></tr>`}</tbody></table></div>`).join('')}
  ${m?`<div class="card"><div class="spread"><h3 style="margin:0">${t('tables')}</h3><button class="btn sm primary" onclick="addTable()">＋ ${t('add_table')}</button></div><div class="row" style="margin-top:8px">${S.tables.map(x=>`<span class="pill blue" style="font-size:13px;padding:6px 10px">${esc(x.label)} <button class="btn sm danger" style="min-height:22px;padding:0 6px;margin-left:4px" aria-label="${t('del')} ${esc(x.label)}" onclick="delTable('${x.id}')">✕</button></span>`).join('')}</div></div>`:''}`;
}
async function toggleSoldOut(id){ const i=S.items.find(x=>x.id===id); try{ await db.update('pos_items', id, { sold_out:!i.sold_out }); await loadCore(); render(); }catch(e){ fail(e); } }
async function editCat(id){
  const c = id ? S.cats.find(x=>x.id===id) : { name:'', name_id:'', station:'kitchen', sort:(S.cats.length+1)*10 };
  const r = await ask({ title:id?t('edit'):t('add_category'), ok:t('save'), fields:[{ id:'name', label:t('name'), value:c.name }, { id:'name_id', label:t('name_id'), value:c.name_id }, { id:'station', label:t('station'), type:'select', value:c.station, options:[['kitchen',t('kitchen_st')],['bar',t('bar')]] }, { id:'sort', label:'Sort', type:'number', value:c.sort }].concat(id?[{ id:'del', label:t('del')+' ('+t('category')+')', type:'checkbox', value:false }]:[]) });
  if(!r || !r.name) return;
  try{
    if(id && r.del){ if(S.items.some(i=>i.category_id===id)){ toast(t('del')+': '+t('by_item')+' > 0', true); return; } await db.remove('pos_categories', id); }
    else if(id) await db.update('pos_categories', id, { name:r.name, name_id:r.name_id, station:r.station, sort:r.sort });
    else await db.insert('pos_categories', [{ outlet_id:OUTLET_ID, name:r.name, name_id:r.name_id, station:r.station, sort:r.sort }]);
    await loadCore(); render();
  }catch(e){ fail(e); }
}
async function editItem(id){
  if(!S.cats.length){ toast(t('add_category'), true); return; }
  const i = id ? S.items.find(x=>x.id===id) : { name:'', name_id:'', price:'', category_id:S.cats[0].id, active:true };
  const r = await ask({ title:id?t('edit'):t('add_item'), ok:t('save'), fields:[{ id:'name', label:t('name'), value:i.name }, { id:'name_id', label:t('name_id'), value:i.name_id }, { id:'price', label:t('price'), type:'number', value:i.price }, { id:'cat', label:t('category'), type:'select', value:i.category_id, options:S.cats.map(c=>[c.id,c.name]) }].concat(id?[{ id:'del', label:t('del'), type:'checkbox', value:false }]:[]) });
  if(!r || !r.name) return;
  try{
    if(id && r.del) await db.update('pos_items', id, { active:false });
    else if(id) await db.update('pos_items', id, { name:r.name, name_id:r.name_id, price:Math.max(0,r.price), category_id:r.cat });
    else await db.insert('pos_items', [{ outlet_id:OUTLET_ID, name:r.name, name_id:r.name_id, price:Math.max(0,r.price), category_id:r.cat, sort:S.items.length+1 }]);
    await loadCore(); render();
  }catch(e){ fail(e); }
}
function parseMenuText(txt){
  const out = [];
  txt.split(/\r?\n/).forEach(line=>{ const p = line.split(/\s*[|\t;]\s*/).map(x=>x.trim()); if(p.length<3 || !p[0] || !p[1]) return;
    const price = parseInt(p[2].replace(/[^\d]/g,'')); if(isNaN(price)) return;
    out.push({ category:p[0], name:p[1], price, station:/bar|minum|drink/i.test(p[3]||'')?'bar':'kitchen' }); });
  return out;
}
async function importMenu(){
  const r = await ask({ title:t('import_menu'), ok:t('import_menu'), html:`<div class="small muted">${t('import_hint')}</div>`, fields:[{ id:'txt', label:'', type:'textarea', rows:10, placeholder:'Makanan | Nasi Goreng | 25000 | kitchen\nMinuman | Es Teh | 8000 | bar' }] });
  if(!r) return; const rows = parseMenuText(r.txt); if(!rows.length){ toast('0', true); return; }
  try{
    const catId = {}; S.cats.forEach(c=>catId[c.name.toLowerCase()]=c.id);
    let sort = S.cats.length;
    for(const name of [...new Set(rows.map(x=>x.category))]) if(!catId[name.toLowerCase()]){
      const st = rows.find(x=>x.category===name).station;
      const c = await db.insert('pos_categories', [{ outlet_id:OUTLET_ID, name, station:st, sort:(++sort)*10 }]); catId[name.toLowerCase()] = c[0].id; }
    let n = S.items.length;
    await db.insert('pos_items', rows.map(x=>({ outlet_id:OUTLET_ID, category_id:catId[x.category.toLowerCase()], name:x.name, price:x.price, sort:++n })));
    await loadCore(); render(); toast(`${rows.length} ✓`);
  }catch(e){ fail(e); }
}
async function addTable(){ const r = await ask({ title:t('add_table'), fields:[{ id:'label', label:t('label'), value:'' }] }); if(!r || !r.label) return; try{ await db.insert('pos_tables', [{ outlet_id:OUTLET_ID, label:r.label, sort:S.tables.length+1 }]); await loadCore(); render(); }catch(e){ fail(e); } }
async function delTable(id){ try{ await db.remove('pos_tables', id); await loadCore(); render(); }catch(e){ fail(e); } }

function setDev(k, v){ S.dev[k]=v; LS.set(k, v); if(k==='autoKitchen' && v) autoPrintKitchen(); }
async function saveOutlet(){
  const g = id => document.getElementById(id);
  const methods = g('oPay').value.split(',').map(x=>x.trim()).filter(x=>x && x.toLowerCase()!=='room');
  try{
    await db.update('pos_outlets', OUTLET_ID, { name:g('oName').value.trim()||S.outlet.name, address:g('oAddr').value.trim(), phone:g('oPhone').value.trim(), tax_rate:Math.max(0,parseFloat(g('oTax').value)||0), tax_inclusive:g('oIncl').checked, pay_methods:methods.length?methods:['Cash'], receipt_footer:g('oFoot').value.trim(), room_charge_enabled:g('oRoom').checked });
    await loadCore(); render(); toast(t('saved'));
  }catch(e){ fail(e); }
}

/* ============================= PRINTING ============================= */
function printHTML(html){
  return new Promise(resolve=>{
    const pa = document.getElementById('printArea');
    pa.style.setProperty('--pw', (S.dev.paper===58?'48mm':'72mm'));
    pa.innerHTML = `<div class="p">${html}</div>`;
    let done = false; const fin = () => { if(done) return; done=true; window.removeEventListener('afterprint', fin); resolve(); };
    window.addEventListener('afterprint', fin); setTimeout(fin, 60000);
    setTimeout(()=>{ try{ window.print(); }catch(e){ fin(); } }, 50);
  });
}
const pr = (a,b) => `<div class="r"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;

function receiptHTML(o, items, payments, isReceipt){

    ${isReceipt?'':`<div class="c b">${t('not_receipt')}</div>`}

    ${pr(o.type==='dine_in'?'Meja/Table '+o.table_label:o.type==='takeaway'?'Bungkus/Takeaway':'Kamar/Room '+o.room_number, o.pax+' pax')}
    ${pr('Kasir/Cashier', o.closed_by||S.session.name)}<hr>

    <div class="r b l"><span>TOTAL</span><span>Rp ${num(o.total)}</span></div>
    ${out.tax_inclusive&&o.tax?pr('Termasuk/Incl. PBJT '+Number(out.tax_rate)+'%', num(o.tax)):''}
    ${pays.length?'<hr>'+pays.map(p=>pr(p.method+(p.room_number?' '+p.room_number:'')+(p.method==='Piutang'&&p.ref?' - '+p.ref:''), num(p.tendered||p.amount))+(p.change?pr('Kembali/Change', num(p.change)):'')).join(''):''}
    ${!isReceipt&&paid<o.total?pr('Sisa/Balance due', num(o.total-paid)):''}
    ${pays.some(p=>p.method==='Room'||p.method==='Piutang')?`<br><div>Tanda tangan tamu / Guest signature:</div><br><br><div>______________________</div>`:''}
    <hr><div class="c">${esc(out.receipt_footer||'')}</div>`;
}
function shiftHTML(sh, by){

  document.getElementById('app').innerHTML = '<div class="login card muted">Loading…</div>';
  try{ await ensureAuth(); S.staffList = await db.rpc('pos_staff_list'); render(); }
  catch(e){ console.error(e); document.getElementById('app').innerHTML = `<div class="login card"><div class="banner">${T.conn_err[0]} / ${T.conn_err[1]}</div><button class="btn primary" onclick="boot()">Retry</button></div>`; }
}
boot();
