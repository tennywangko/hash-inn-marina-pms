<style>
:root{--navy:#0B2A4A;--navy-2:#123A63;--navy-3:#1B4B7C;--accent:#4F9FD8;--accent-soft:#E9F3FB;--bg:#F2F6FA;--card:#fff;--border:#DFE6EE;--text:#152436;--muted:#66768A;
--green:#2F9E5C;--green-soft:#E7F6EC;--amber:#C98A1E;--amber-soft:#FBF1DE;--red:#C24C43;--red-soft:#FBEAE8;--gray-soft:#EEF1F4;--radius:10px;--shadow:0 1px 2px rgba(11,42,74,.06),0 4px 14px rgba(11,42,74,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:13px}
.brand h1{font-size:15px;margin:0}.brand span{font-size:11px;color:#BFD9F0}
.hdr-right{display:flex;align-items:center;gap:8px;font-size:12px;color:#BFD9F0}.hdr-right button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:8px;font-size:12px}
nav{background:var(--navy-2);display:flex;gap:2px;padding:0 10px;overflow-x:auto;position:sticky;top:0;z-index:40}
nav button{background:transparent;border:none;color:#CFE1F2;padding:12px 14px;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:#fff;border-bottom-color:var(--accent);font-weight:600}
main{padding:14px 16px 60px;max-width:1200px;margin:0 auto}
h2{font-size:17px;margin:2px 0 12px;color:var(--navy)}h3{font-size:14px;margin:0 0 8px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.bold{font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:10px 14px;border-radius:8px;font-weight:600;min-height:42px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}.btn.sm{padding:6px 10px;min-height:32px;font-size:12.5px}.btn:disabled{opacity:.5}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.amber{background:var(--amber-soft);color:var(--amber)}.pill.red{background:var(--red-soft);color:var(--red)}.pill.gray{background:var(--gray-soft);color:var(--muted)}.pill.blue{background:var(--accent-soft);color:var(--navy-3)}
.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi .v{font-size:20px;font-weight:800;color:var(--navy)}.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.neg{color:var(--red)}.pos{color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--border);background:#fff;border-radius:20px;padding:8px 14px;font-weight:600;color:var(--muted)}
.chips button.active{background:var(--navy);border-color:var(--navy);color:#fff}
.modes{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.mode{border:2px solid var(--border);background:#fff;border-radius:var(--radius);padding:12px;text-align:left}
.mode.active{border-color:var(--navy);background:var(--accent-soft)}.mode b{display:block;font-size:14px;color:var(--navy)}.mode span{font-size:12px;color:var(--muted)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
table.t{width:100%;border-collapse:collapse}table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}table.t .right{text-align:right;white-space:nowrap}
tr.sec td{background:var(--accent-soft);font-weight:700;color:var(--navy);font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
tr.tot td{font-weight:700;border-top:2px solid var(--navy)}tr.big td{font-weight:800;font-size:15px;background:var(--gray-soft)}
.voided td{text-decoration:line-through;color:var(--muted)}
.banner{background:var(--amber-soft);color:#7a5410;border:1px solid #ecd9ae;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.login{max-width:360px;margin:8vh auto 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:200;max-width:92vw}.toast.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(11,42,74,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.scroll{overflow-x:auto}
@media (max-width:760px){.two,.formgrid{grid-template-columns:1fr}main{padding:10px 10px 60px}.hide-m{display:none}}
@media print{header,nav,.noprint,.toast{display:none !important}body{background:#fff}main{max-width:none;padding:0}.card{box-shadow:none;border:none;padding:0}}
#printArea{display:none}
.slip{border:1px solid #9aa5b1;border-radius:6px;padding:12px 14px;margin:0 auto 12px;break-inside:avoid;page-break-inside:avoid;font-size:12px;max-width:560px;background:#fff}
.slip table.t td{padding:3px 6px}.slip-h{text-align:center;border-bottom:1px solid #9aa5b1;padding-bottom:5px;margin-bottom:6px}.slip-t{text-align:center;font-weight:700;margin:4px 0 8px;letter-spacing:.3px}
.slip-sign{display:flex;justify-content:space-between;margin-top:10px;text-align:center}table.pr td{padding:4px 5px}table.pr input:disabled,table.pr select:disabled{background:transparent;border-color:transparent;color:var(--text)}
@media print{body.printing #app,body.printing #modalBg{display:none !important}body.printing #printArea{display:block}#printArea .slip:nth-child(2n){page-break-after:always;break-after:page}}
</style>

}

/* ---------- P&L maths (shared by Home and Report) ---------- */
function calcPnl(p){
  const cols = DEPTS.filter(d=>d==='hotel'||d==='resto'||p.revenue.some(r=>r.dept===d)||p.expenses.some(e=>e.dept===d&&['cogs','opex','payroll','nonop'].includes(e.section)));
  const sec = { revenue:{}, cogs:{}, opex:{}, payroll:{}, nonop:{} };
  const add = (s,label,dept,amt,sort) => { const o=sec[s][label]||(sec[s][label]={label,sort:sort||0,by:{}}); o.by[dept]=(o.by[dept]||0)+amt; };
  p.revenue.forEach(r=>add('revenue', r.label, r.dept, r.amount, r.label==='Diskon'?999:0));
  p.expenses.forEach(e=>{ if(sec[e.section]) add(e.section, S.lang==='id'?e.name_id:e.name_en, e.dept, e.amount, e.sort); });
  const rows = s => Object.values(sec[s]).sort((a,b)=>a.sort-b.sort || (sumBy(b.by)-sumBy(a.by)));
  const sumBy = by => Object.values(by).reduce((a,b)=>a+b,0);
  const tot = s => { const by={}; Object.values(sec[s]).forEach(o=>Object.entries(o.by).forEach(([d,a])=>by[d]=(by[d]||0)+a)); return by; };
  const T_ = { revenue:tot('revenue'), cogs:tot('cogs'), opex:tot('opex'), payroll:tot('payroll'), nonop:tot('nonop') };
  const comb = f => { const by={}; cols.forEach(d=>by[d]=f(d)); return by; };
  const g = (s,d) => T_[s][d]||0;
  const gross = comb(d=>g('revenue',d)-g('cogs',d)), op = comb(d=>g('revenue',d)-g('cogs',d)-g('opex',d)-g('payroll',d)), after = comb(d=>op[d]-g('nonop',d));
  const other = k => p.expenses.filter(e=>e.section===k).reduce((a,e)=>a+e.amount,0);
  const otherIn = k => p.other_in.filter(e=>e.section===k).reduce((a,e)=>a+e.amount,0);
  return { cols, rows, sumBy, T_, gross, op, after, revTotal:sumBy(T_.revenue), prive:other('owner'), modal:otherIn('owner'), kbGiven:other('advance'), kbRepaid:otherIn('advance') };
}

async function saveForm(){

  const amount=parseInt(f.amount)||0;
  const p = { tx_date:f.tx_date, direction:f.mode==='tr'?'transfer':(f.mode==='out'||f.category_id==='adv_kasbon')?'out':'in', dept:f.mode==='tr'?'umum':f.dept, category_id:f.category_id, account_id:f.account_id, to_account_id:f.to_account_id,
    amount, description:f.description, supplier:f.supplier||'', person:f.person||'', qty:f.qty||'', unit:f.unit||'', unit_price:f.unit_price||'', ref_no:f.ref_no||'', due_date:f.account_id==='hutang'?(f.due_date||''):'' };
  if(!amount){ toast(t('amount')+'?', true); return; }
  if(f.mode==='lo'){ if(!f.person){ toast(t('lo_name')+'?', true); return; } const out=f.lo_dir!=='in'; Object.assign(p, { direction:'transfer', dept:'umum', category_id:null, account_id:out?f.account_id:'antar_usaha', to_account_id:out?'antar_usaha':f.account_id }); }
  if(f.mode!=='tr' && f.mode!=='lo' && !f.category_id){ toast(t('category')+'?', true); return; }
  if(f.mode==='tr' && f.account_id===f.to_account_id){ toast(t('to_acc')+'?', true); return; }
  if(f.account_id==='hutang' && !f.supplier){ toast(t('supplier')+'?', true); return; }
  if(f.account_id==='piutang' && !f.person){ toast(t('who_owes')+'?', true); return; }
  S.busy=true;
  try{
    if(f.mode==='out' && (S.photo || S.photoPath)){ if(!S.photoPath) S.photoPath = await uploadReceipt(S.photo, f.tx_date); p.receipt_path = S.photoPath; }

    if(!(f.mode==='out' && S.sameNota)){ S.photo=null; S.photoPath=null; }

    newForm(f.mode); S.form.tx_date=keep.tx_date; S.form.account_id=keep.acc; if(f.mode==='out' && S.sameNota){ S.form.category_id=keep.cat; S.form.supplier=keep.sup; S.form.ref_no=keep.ref; if(keep.acc==='hutang') S.form.due_date=f.due_date; } if(f.mode==='kb') S.form.category_id=keep.cat; if(f.mode==='lo') S.form.lo_dir=f.lo_dir;
    await Promise.all([loadToday(), reboot()]); S.home=null; S.ledger=null; render(); const el=document.getElementById(f.mode==='out'?'f_description':'f_amount'); if(el) el.focus();
  }catch(e){ fail(e); } finally{ S.busy=false; }
}

/* ---------- RECEIPT PHOTOS ---------- */
function compressImage(file){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const sc=Math.min(1, 1400/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error('Foto tidak bisa diproses / cannot process photo')),'image/jpeg',0.7); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Foto tidak bisa dibaca. Gunakan JPG atau PNG. / Cannot read photo. Use JPG or PNG.')); }; img.src=url; }); }
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
async function uploadReceipt(blob, date){ const path=`${date.slice(0,7)}/${uuid()}.jpg`; const { error } = await sb.storage.from('bo-receipts').upload(path, blob, { contentType:'image/jpeg' }); if(error) throw new Error(t('relogin')); return path; }
async function pickPhoto(input){ const f=input.files[0]; if(!f) return; try{ S.photo = await compressImage(f); S.photoPath=null; document.getElementById('photoInfo').textContent = t('photo_ready')+' · '+Math.round(S.photo.size/1024)+' KB'; }catch(e){ input.value=''; fail(e); } }
async function viewReceipt(path){ try{ const { data, error } = await sb.storage.from('bo-receipts').createSignedUrl(path, 300); if(error) throw error;
  await ask({ title:t('photo'), html:`<img src="${esc(data.signedUrl)}" alt="${t('photo')}" style="max-width:100%;border-radius:8px">`, ok:'OK' }); }catch(e){ fail(e); } }
async function attachPhoto(id, input){ const f=input.files[0]; if(!f) return;
  try{ const tx=(S.todayTx||[]).concat(S.list||[]).find(x=>x.id===id); const path=await uploadReceipt(await compressImage(f), tx.tx_date); await api('bo_set_receipt', { p_id:id, p_path:path });
    if(S.tab==='entry') await loadToday(); else await loadList(); render(); toast(t('saved')); }catch(e){ fail(e); } }

async function settle(kind, i){
  const x=S.ledger[kind][i], accs=S.boot.accounts.filter(a=>a.active && (a.type==='cash'||a.type==='bank'));
  const r = await ask({ title:`${kind==='hutang'?t('pay_sup'):kind==='antar_usaha'?(x.balance>0?t('lo_receive'):t('lo_pay')):t('receive')} · ${x.name}`, html:`<div>${t('balance')}: <b>${money(x.balance)}</b></div>`, ok:t('save'),
    fields:[{ id:'amount', label:t('amount'), type:'number', value:Math.abs(x.balance) }, { id:'acc', label:(kind==='hutang'||(kind==='antar_usaha'&&x.balance<0))?t('paid_from'):t('received_in'), type:'select', value:'kas_resto', options:accs.map(a=>[a.id,a.name]) }, { id:'date', label:t('date'), type:'date', value:today() }] });
  if(!r) return; if(r.amount<=0){ toast(t('amount')+'?', true); return; }
  const p = kind==='antar_usaha' ? (x.balance>0 ? { tx_date:r.date, direction:'transfer', account_id:'antar_usaha', to_account_id:r.acc, amount:r.amount, person:x.name } : { tx_date:r.date, direction:'transfer', account_id:r.acc, to_account_id:'antar_usaha', amount:r.amount, person:x.name })

async function loadPnl(){ const [a,b]=monthRange(S.month); S.pnl = await api('bo_pnl', { p_from:a, p_to: b>today()&&S.month===today().slice(0,7)?today():b }); }
function shiftMonth(n){ const [y,m]=S.month.split('-').map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); const s=d.toISOString().slice(0,7); if(s>today().slice(0,7)) return; S.month=s; S.pnl=null; go('report'); }
function pnlRows(){
  const p=S.pnl, k=calcPnl(p), cols=k.cols, rows=[];
  const cells = by => cols.map(d=>by[d]||0).concat([k.sumBy(by)]);
  const sec=(key,label)=>{ const r=k.rows(key); if(!r.length && key!=='revenue') return; rows.push({ type:'sec', label }); r.forEach(o=>rows.push({ type:'line', label:o.label, v:cells(o.by) })); };
  sec('revenue', t('s_revenue')); rows.push({ type:'tot', label:t('t_revenue'), v:cells(k.T_.revenue) });
  sec('cogs', t('s_cogs')); rows.push({ type:'tot', label:t('t_gross'), v:cells(k.gross) });
  sec('opex', t('s_opex')); sec('payroll', t('s_payroll')); rows.push({ type:'big', label:t('t_op'), v:cells(k.op) });
  if(k.rows('nonop').length){ sec('nonop', t('s_nonop')); rows.push({ type:'tot', label:t('t_after'), v:cells(k.after) }); }
  return { k, cols, rows };
}

async function saveSettings(n){ const map={}; for(let i=0;i<n;i++){ const el=document.getElementById('map_'+i); if(el.value) map[el.dataset.m]=el.value; }

/* ---------- PAYROLL ---------- */
const PR_MONEY = ['basic','fixed_allowance','overtime','incentive','transport','bonus_attendance','bonus_other','late_amount','kasbon','piutang'];
const PR_DAYS = ['days_alpa','days_ijin','days_sakit'];
const prDefaultPeriod = () => { const d=today(); return d.slice(0,7); };
const lastDay = m => monthRange(m)[1];
function prSettings(){ const r=S.pr&&S.pr.run; return (r && r.status==='posted' && r.settings && r.settings.divisor) ? r.settings : (S.pr?S.pr.settings:{ divisor:26 }); }
function prCalc(l, st){
  const dv=Math.max(Number(st.divisor)||26,1), rate=Math.round((+l.basic||0)/dv);
  const days=(+l.days_alpa||0)+(st.deduct_ijin?(+l.days_ijin||0):0)+(st.deduct_sakit?(+l.days_sakit||0):0);
  const absence=Math.round(rate*days);
  const gross=['basic','fixed_allowance','overtime','incentive','transport','bonus_attendance','bonus_other'].reduce((a,k)=>a+(+l[k]||0),0);
  const earned=gross-absence-(+l.late_amount||0), thp=earned-(+l.kasbon||0)-(+l.piutang||0);
  return { rate, days, absence, gross, earned, thp, pct: earned>0 ? (+l.kasbon||0)/earned : 0 };
}
const prBal = name => { const k=String(name||'').trim().toLowerCase(); return ((S.pr&&S.pr.balances)||[]).find(b=>b.k===k)||{ kasbon:0, piutang:0 }; };
const prEditable = () => S.pr && (!S.pr.run || S.pr.run.status==='draft');
const prHistoric = () => S.prPayDate && S.pr && S.prPayDate < S.pr.start_date;
function personList(){ return [...new Set((S.boot.persons||[]).concat((S.boot.employees||[]).map(e=>e.name)))].sort(); }

async function loadPayroll(){
  S.pr = await api('bo_payroll_data', { p_period:S.prPeriod });
  const r=S.pr.run; S.prDirty=false;
  S.prLines = r ? r.lines.map(l=>Object.assign({}, l)) : null;
  S.prPayDate = r && r.pay_date ? r.pay_date : lastDay(S.prPeriod);
  S.prNote = r ? (r.note||'') : '';
}
function prShiftMonth(n){ if(S.prDirty && !confirm(t('pr_unsaved'))) return; const [y,m]=S.prPeriod.split('-').map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); S.prPeriod=d.toISOString().slice(0,7); go('payroll'); }
function prNew(){
  S.prLines = S.pr.employees.filter(e=>e.active).map(e=>{ const b=prBal(e.name); return { employee_id:e.id, name:e.name, dept:e.dept, position:e.position, basic:e.basic_salary, fixed_allowance:e.fixed_allowance,
    overtime:0, incentive:0, transport:0, bonus_attendance:0, bonus_other:0, days_alpa:0, days_ijin:0, days_sakit:0, late_amount:0, kasbon:Math.max(b.kasbon,0), piutang:Math.max(b.piutang,0), pay_account:e.pay_account, note:'' }; });
  S.prDirty=true; render();
}
function prSet(i, k, v){
  const l=S.prLines[i]; if(!l) return;
  l[k] = PR_MONEY.includes(k) ? (parseInt(String(v).replace(/[^\d]/g,''))||0) : PR_DAYS.includes(k) ? (parseFloat(String(v).replace(',','.'))||0) : v;
  S.prDirty=true; prRefresh(i);
}
function prRefresh(i){
  const st=prSettings(), l=S.prLines[i], c=prCalc(l, st), lim=Number(st.kasbon_limit)||0;
  const set=(id,h,cls)=>{ const el=document.getElementById(id); if(el){ el.innerHTML=h; if(cls!==undefined) el.className=cls; } };
  set('pr_abs_'+i, c.absence?num(c.absence):'—', 'right');
  set('pr_earn_'+i, num(c.earned), 'right');
  set('pr_thp_'+i, money(c.thp), 'right bold '+(c.thp<0?'neg':''));
  set('pr_pct_'+i, c.pct?Math.round(c.pct*100)+'%':'—', 'right '+(lim && c.pct>lim?'neg bold':'muted'));
  set('prSummary', prSummaryHtml()); set('prChecks', prChecksHtml()); set('prTotRow', prTotRowHtml());
}
function prTotals(){
  const st=prSettings(), T_={ gross:0, absence:0, late:0, earned:0, kasbon:0, piutang:0, thp:0, n:0 }, byAcc={}, byDept={};
  (S.prLines||[]).forEach(l=>{ const c=prCalc(l, st); T_.gross+=c.gross; T_.absence+=c.absence; T_.late+=(+l.late_amount||0); T_.earned+=c.earned; T_.kasbon+=(+l.kasbon||0); T_.piutang+=(+l.piutang||0); T_.thp+=c.thp; T_.n++;
    byAcc[l.pay_account]=(byAcc[l.pay_account]||0)+c.thp; const d=byDept[l.dept]||(byDept[l.dept]={ n:0, earned:0, thp:0 }); d.n++; d.earned+=c.earned; d.thp+=c.thp; });
  return { T_, byAcc, byDept };
}
function prSummaryHtml(){
  const { T_, byAcc, byDept } = prTotals();
  return `<div class="grid kpis" style="margin-bottom:10px">${[[t('pr_staff'), T_.n, ''],[t('pr_cost'), money(T_.earned), t('pr_cost_d')],[t('pr_kasbon_cut'), money(T_.kasbon+T_.piutang), `${t('m_kb')} ${num(T_.kasbon)} · ${t('pr_piutang_s')} ${num(T_.piutang)}`],[t('pr_to_pay'), money(T_.thp), Object.entries(byAcc).map(([a,v])=>`${esc(accName(a))} ${num(v)}`).join(' · ')]]
    .map(x=>`<div class="card kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[2]}</div></div>`).join('')}</div>
    <div class="small muted" style="margin-bottom:8px">${Object.entries(byDept).map(([d,v])=>`<b>${t(d)}</b>: ${v.n} ${t('pr_people')} · ${t('pr_cost')} ${money(v.earned)} · ${t('pr_to_pay')} ${money(v.thp)}`).join(' &nbsp;|&nbsp; ')}</div>`;
}
function prChecks(){
  const st=prSettings(), lim=Number(st.kasbon_limit)||0, out=[], hist=prHistoric(), posted=S.pr.run&&S.pr.run.status==='posted';
  (S.prLines||[]).forEach(l=>{ const c=prCalc(l, st), b=prBal(l.name);
    if(c.thp<0) out.push(['red', `<b>${esc(l.name)}</b>: ${t('pr_ck_neg')} (${money(c.thp)})`]);
    if(lim && c.pct>lim) out.push(['amber', `<b>${esc(l.name)}</b>: ${t('pr_ck_limit')} ${Math.round(c.pct*100)}% (${t('pr_limit')} ${Math.round(lim*100)}%)`]);
    if(!hist && !posted){
      if((+l.kasbon||0) > Math.max(b.kasbon,0)) out.push(['amber', `<b>${esc(l.name)}</b>: ${t('pr_ck_kb_over')} ${money(Math.max(b.kasbon,0))}`]);
      if(b.kasbon>0 && (+l.kasbon||0) < b.kasbon) out.push(['blue', `<b>${esc(l.name)}</b>: ${t('pr_ck_kb_left')} ${money(b.kasbon-(+l.kasbon||0))}`]);
      if((+l.piutang||0) > Math.max(b.piutang,0)) out.push(['blue', `<b>${esc(l.name)}</b>: ${money((+l.piutang||0)-Math.max(b.piutang,0))} ${t('pr_ck_pt_other')}`]);
    }
    if(!(+l.basic)) out.push(['amber', `<b>${esc(l.name)}</b>: ${t('pr_ck_nobasic')}`]);
  });
  if(!posted){ const inRun=new Set((S.prLines||[]).map(l=>l.name.trim().toLowerCase()));
    S.pr.employees.filter(e=>e.active && !inRun.has(e.name.trim().toLowerCase())).forEach(e=>out.push(['blue', `<b>${esc(e.name)}</b>: ${t('pr_ck_missing')}`])); }
  if(hist && !posted) out.push(['blue', t('pr_ck_hist')]);
  return out;
}
function prChecksHtml(){ const c=prChecks(); if(!c.length) return `<span class="pill green">✓ ${t('pr_ck_ok')}</span>`;
  return c.map(x=>`<div class="row small" style="margin:3px 0;flex-wrap:nowrap;align-items:flex-start"><span class="pill ${x[0]}">${x[0]==='red'?'!':x[0]==='amber'?'⚠':'i'}</span><span>${x[1]}</span></div>`).join(''); }
function prTotRowHtml(){ const { T_ } = prTotals(); const st=prSettings(); const s=k=>(S.prLines||[]).reduce((a,l)=>a+(+l[k]||0),0);
  return `<td></td><td class="bold">${t('total')}</td>${['basic','fixed_allowance','overtime','incentive','transport','bonus_attendance','bonus_other'].map(k=>`<td class="right">${num(s(k))}</td>`).join('')}
    <td class="right">${s('days_alpa')||''}</td><td class="right">${s('days_ijin')||''}</td><td class="right">${s('days_sakit')||''}</td><td class="right">${num(T_.absence)}</td><td class="right">${num(s('late_amount'))}</td><td class="right">${num(T_.earned)}</td>
    <td class="right">${num(T_.kasbon)}</td><td class="right">${num(T_.piutang)}</td><td class="right bold">${money(T_.thp)}</td><td class="right muted">${T_.earned?Math.round(T_.kasbon/T_.earned*100)+'%':''}</td><td colspan="2"></td>`; }

function vPayroll(){
  if(!S.pr) return `<div class="card muted">…</div>`;
  const owner=S.user.role==='owner', view=S.prView||'run';
  const head=`<div class="spread" style="margin-bottom:10px"><h2 style="margin:0">${t('payroll')}</h2>
    <div class="chips noprint">${[['run','pr_v_run'],['staff','pr_v_staff'],['hist','pr_v_hist']].map(v=>`<button class="${view===v[0]?'active':''}" onclick="S.prView='${v[0]}';render()">${t(v[1])}</button>`).join('')}</div></div>`;
  if(view==='staff') return head+vPrStaff(owner);
  if(view==='hist') return head+vPrHist();
  const r=S.pr.run, ed=prEditable(), posted=r&&r.status==='posted';
  const bar=`<div class="spread noprint" style="margin-bottom:10px"><div class="row"><button class="btn sm" onclick="prShiftMonth(-1)">${t('prev')}</button><b style="font-size:16px;color:var(--navy)">${monthLabel(S.prPeriod)}</b><button class="btn sm" onclick="prShiftMonth(1)">${t('next')}</button>
      ${r?`<span class="pill ${posted?'green':'amber'}">${posted?(r.record_only?t('pr_st_record'):t('pr_st_posted')):t('pr_st_draft')}</span>`:''}${S.prDirty?`<span class="pill red">${t('pr_unsaved_s')}</span>`:''}</div>
    <div class="row">${S.prLines?`<button class="btn sm" onclick="prPrint()">${t('pr_slips')}</button><button class="btn sm" onclick="prExport()">${t('excel')}</button>`:''}
      ${ed&&S.prLines?`<button class="btn sm" onclick="prRefill()">${t('pr_refill')}</button><button class="btn sm primary" onclick="prSave()">${t('pr_save')}</button>${owner?`<button class="btn sm green" onclick="prPost()">${t('pr_post')}</button>`:''}`:''}
      ${posted&&owner?`<button class="btn sm danger" onclick="prUnpost()">${t('pr_unpost')}</button>`:''}${ed&&r&&owner?`<button class="btn sm danger" onclick="prDelete()">${t('pr_delete')}</button>`:''}</div></div>`;
  if(!S.prLines) return head+bar+`<div class="card"><p>${t('pr_none')} <b>${monthLabel(S.prPeriod)}</b>.</p>
      ${S.pr.employees.filter(e=>e.active).length?`<button class="btn primary" onclick="prNew()">${t('pr_create')} (${S.pr.employees.filter(e=>e.active).length} ${t('pr_people')})</button>`:`<p class="muted">${t('pr_no_staff')}</p><button class="btn" onclick="S.prView='staff';render()">${t('pr_v_staff')}</button>`}</div>`;
  const st=prSettings(), lim=Number(st.kasbon_limit)||0, dis=ed?'':'disabled';
  const accs=S.boot.accounts.filter(a=>a.active && (a.type==='cash'||a.type==='bank'));
  const inp=(i,k,v,w)=>`<input aria-label="${t('pr_c_'+k)}" ${dis} value="${v?(PR_DAYS.includes(k)?v:num(v)):''}" inputmode="${PR_DAYS.includes(k)?'decimal':'numeric'}" style="width:${w||92}px;padding:5px 6px;font-size:13px;text-align:right" oninput="prSet(${i},'${k}',this.value)">`;
  const depts=[...new Set(S.prLines.map(l=>l.dept))];
  const rows=depts.map(d=>`<tr class="sec"><td colspan="21">${t(d)}</td></tr>`+S.prLines.map((l,i)=>{ if(l.dept!==d) return ''; const c=prCalc(l, st);
    return `<tr><td class="noprint">${ed?`<button class="btn sm" aria-label="${t('pr_remove')}" title="${t('pr_remove')}" onclick="prRemove(${i})">×</button>`:''}</td>
      <td style="white-space:nowrap"><b>${esc(l.name)}</b>${l.position?`<div class="small muted">${esc(l.position)}</div>`:''}</td>
      ${['basic','fixed_allowance','overtime','incentive','transport','bonus_attendance','bonus_other'].map(k=>`<td>${inp(i,k,l[k])}</td>`).join('')}
      ${PR_DAYS.map(k=>`<td>${inp(i,k,l[k],52)}</td>`).join('')}
      <td id="pr_abs_${i}" class="right">${c.absence?num(c.absence):'—'}</td><td>${inp(i,'late_amount',l.late_amount,80)}</td><td id="pr_earn_${i}" class="right">${num(c.earned)}</td>
      <td>${inp(i,'kasbon',l.kasbon)}${prBal(l.name).kasbon&&ed?`<div class="small muted right">${t('pr_rec')} ${num(prBal(l.name).kasbon)}</div>`:''}</td>
      <td>${inp(i,'piutang',l.piutang,84)}${prBal(l.name).piutang&&ed?`<div class="small muted right">${t('pr_rec')} ${num(prBal(l.name).piutang)}</div>`:''}</td>
      <td id="pr_thp_${i}" class="right bold ${c.thp<0?'neg':''}">${money(c.thp)}</td><td id="pr_pct_${i}" class="right ${lim&&c.pct>lim?'neg bold':'muted'}">${c.pct?Math.round(c.pct*100)+'%':'—'}</td>
      <td><select ${dis} aria-label="${t('pr_c_pay_account')}" style="width:130px;padding:5px;font-size:13px" onchange="prSet(${i},'pay_account',this.value)">${accs.map(a=>`<option value="${a.id}" ${a.id===l.pay_account?'selected':''}>${esc(a.name)}</option>`).join('')}</select></td>
      <td><input ${dis} aria-label="${t('note')}" value="${esc(l.note||'')}" style="width:200px;padding:5px 6px;font-size:13px" oninput="prSet(${i},'note',this.value)"></td></tr>`; }).join('')).join('');
  const notIn=S.pr.employees.filter(e=>e.active && !S.prLines.some(l=>l.name.trim().toLowerCase()===e.name.trim().toLowerCase()));
  return head+bar+`<div id="prSummary">${prSummaryHtml()}</div>
    <div class="grid two" style="margin-bottom:10px"><div class="card"><h3>${t('pr_checks')}</h3><div id="prChecks">${prChecksHtml()}</div></div>
      <div class="card"><div class="formgrid"><div><label class="f" for="prPay">${t('pr_paydate')}</label><input id="prPay" type="date" ${dis} value="${S.prPayDate||''}" onchange="S.prPayDate=this.value;S.prDirty=true;render()"></div>
        <div><label class="f">${t('pr_rules')}</label><div class="small">${t('pr_divisor')} ${st.divisor} · ${t('pr_ijin')} ${st.deduct_ijin?t('pr_cut'):t('pr_nocut')} · ${t('pr_sakit')} ${st.deduct_sakit?t('pr_cut'):t('pr_nocut')} · ${t('pr_limit')} ${Math.round((st.kasbon_limit||0)*100)}%</div></div></div>
        <label class="f" for="prNote">${t('note')}</label><input id="prNote" ${dis} value="${esc(S.prNote||'')}" oninput="S.prNote=this.value;S.prDirty=true">
        ${ed&&notIn.length?`<div class="row" style="margin-top:8px"><select id="prAddSel" style="max-width:240px">${notIn.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><button class="btn sm" onclick="prAdd()">＋ ${t('pr_add')}</button></div>`:''}
        ${posted?`<div class="small muted" style="margin-top:8px">${t('pr_posted_by')} ${esc(r.posted_by||'')} · ${r.pay_date}${r.record_only?' · '+t('pr_record_note'):` · ${(r.tx||[]).length} ${t('pr_entries')}`}</div>`:''}</div></div>
    <div class="card scroll"><table class="t pr"><thead><tr><th class="noprint"></th><th>${t('name')}</th>${['basic','fixed_allowance','overtime','incentive','transport','bonus_attendance','bonus_other','days_alpa','days_ijin','days_sakit'].map(k=>`<th class="right">${t('pr_c_'+k)}</th>`).join('')}
      <th class="right">${t('pr_c_absence')}</th><th class="right">${t('pr_c_late_amount')}</th><th class="right">${t('pr_c_earned')}</th><th class="right">${t('pr_c_kasbon')}</th><th class="right">${t('pr_c_piutang')}</th><th class="right">${t('pr_c_thp')}</th><th class="right">${t('pr_c_pct')}</th><th>${t('pr_c_pay_account')}</th><th>${t('note')}</th></tr></thead>
      <tbody>${rows}<tr class="tot" id="prTotRow">${prTotRowHtml()}</tr></tbody></table></div>
    <div class="small muted" style="margin-top:8px">${t('pr_help')}</div>`;
}
function prRemove(i){ S.prLines.splice(i,1); S.prDirty=true; render(); }
function prAdd(){ const id=document.getElementById('prAddSel').value, e=S.pr.employees.find(x=>x.id===id); if(!e) return; const b=prBal(e.name);

const GL_TYPES = ['asset','liability','equity','revenue','expense'];
async function loadGL(){ S.gl = await api('bo_gl_data', { p_from:S.glFrom, p_to:S.glTo }); }
const glAcc = code => ((S.gl&&S.gl.accounts)||S.boot.gl_accounts||[]).find(a=>a.code===code);
const glName = code => { const a=glAcc(code); return a ? (S.lang==='id'?a.name_id:a.name_en) : code; };
const glType = code => { const a=glAcc(code); return a ? a.type : ({ '1':'asset','2':'liability','3':'equity','4':'revenue' }[String(code)[0]]||'expense'); };
function glShiftMonth(n){ const [y,m]=S.glFrom.slice(0,7).split('-').map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); const s=d.toISOString().slice(0,7); if(s>today().slice(0,7)) return; const [a,b]=monthRange(s); S.glFrom=a; S.glTo=b>today()?today():b; go('gl'); }
function glTB(){ const tb={}; (S.gl.tb||[]).forEach(x=>tb[x.code]={ opening:+x.opening, debit:+x.debit, credit:+x.credit });
  return S.gl.accounts.map(a=>{ const x=tb[a.code]||{ opening:0, debit:0, credit:0 }; return Object.assign({ code:a.code, type:a.type, name:glName(a.code), active:a.active }, x, { closing:x.opening+x.debit-x.credit }); })
    .concat((S.gl.tb||[]).filter(x=>!S.gl.accounts.some(a=>a.code===x.code)).map(x=>({ code:x.code, type:glType(x.code), name:x.code, opening:+x.opening, debit:+x.debit, credit:+x.credit, closing:+x.opening+(+x.debit)-(+x.credit) }))); }

function vGlTB(){

function vGlBS(){
  const rows=glTB(), sum=ty=>rows.filter(r=>r.type===ty).reduce((a,r)=>a+r.closing,0);
  const A=sum('asset'), L=-sum('liability'), E=-sum('equity'), P=-(sum('revenue')+sum('expense'));
  const block=(ty,sign)=>rows.filter(r=>r.type===ty&&r.closing).map(r=>`<tr><td class="small muted">${r.code}</td><td>${esc(r.name)}</td><td class="right">${money(sign*r.closing)}</td></tr>`).join('')||`<tr><td></td><td class="muted">—</td><td></td></tr>`;
  return `<div class="grid two"><div class="card"><h3>${t('gl_t_asset')}</h3><table class="t"><tbody>${block('asset',1)}<tr class="tot"><td></td><td>${t('gl_tot_asset')}</td><td class="right">${money(A)}</td></tr></tbody></table></div>

      <h3 style="margin-top:14px">${t('gl_t_equity')}</h3><table class="t"><tbody>${block('equity',-1)}<tr><td></td><td>${t('gl_cur_profit')}</td><td class="right ${P<0?'neg':''}">${money(P)}</td></tr><tr class="tot"><td></td><td>${t('gl_tot_eq')}</td><td class="right">${money(E+P)}</td></tr>
      <tr class="big"><td></td><td>${t('gl_tot_le')}</td><td class="right">${money(L+E+P)}</td></tr></tbody></table>
      <div style="margin-top:8px">${A===L+E+P?`<span class="pill green">✓ ${t('gl_balanced')}</span>`:`<span class="pill red">${t('gl_unbalanced')} ${money(A-L-E-P)}</span>`}</div></div></div>
    <div class="small muted" style="margin-top:8px">${t('gl_bs_note')} ${S.gl.to}.</div>`;
}

async function glExport(){
  if(S.busy) return; S.busy=true;
  try{ await loadScript(XLSX_LIB); const wb=new ExcelJS.Workbook(), NUM='#,##0;[Red]-#,##0', NAVY='FF0B2A4A';
    const head=(ws)=>ws.getRow(1).eachCell(c=>{ c.font={ bold:true, color:{ argb:'FFFFFFFF' } }; c.fill={ type:'pattern', pattern:'solid', fgColor:{ argb:NAVY } }; });
    const w1=wb.addWorksheet('Neraca Saldo'); w1.columns=[['Kode',8],['Akun',38],['Jenis',11],['Saldo awal',16],['Debit',16],['Kredit',16],['Saldo akhir',16]].map(c=>({ header:c[0], width:c[1] }));
    glTB().filter(r=>r.opening||r.debit||r.credit).forEach(r=>{ const row=w1.addRow([r.code, r.name, t('gl_t_'+r.type), r.opening, r.debit, r.credit, r.closing]); [4,5,6,7].forEach(k=>row.getCell(k).numFmt=NUM); }); head(w1);
    const w2=wb.addWorksheet('Jurnal'); w2.columns=[['Tanggal',12],['Sumber',8],['Ref',10],['Keterangan',50],['Kode',8],['Akun',32],['Bagian',10],['Debit',15],['Kredit',15]].map(c=>({ header:c[0], width:c[1] }));
    (S.gl.lines||[]).forEach(l=>{ const row=w2.addRow([l.d, l.src, l.ref, l.memo, l.code, glName(l.code), l.dept, +l.debit||null, +l.credit||null]); [8,9].forEach(k=>row.getCell(k).numFmt=NUM); }); head(w2);
    const buf=await wb.xlsx.writeBuffer(); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{ type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); a.download=`Buku-Besar-${S.gl.from}_${S.gl.to}.xlsx`; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ fail(e); } finally{ S.busy=false; }
}

function stCopyLast(silent){
  const f=S.stForm, last=S.st.counts.find(c=>c.location===f.location && c.id!==f.id && c.lines.length);
  if(!last){ if(!silent) toast(t('st_nolast'), true); if(!f.lines.length) f.lines=[{ item:'', grp:'makanan', unit:'', qty:'', unit_cost:'' }]; return; }
  const have=new Set(f.lines.filter(l=>l.item).map(l=>l.item.trim().toLowerCase()));
  f.lines=f.lines.filter(l=>l.item).concat(last.lines.filter(l=>!have.has(l.item.trim().toLowerCase())).map(l=>({ item:l.item, grp:l.grp, unit:l.unit, qty:'', unit_cost:l.unit_cost })));

}
async function stSave(finalize){
  const f=S.stForm; if(!f.lines.some(l=>l.item)){ toast(t('st_item')+'?', true); return; }
  const missing=f.lines.filter(l=>l.item && (l.qty===''||l.qty==null)).length;
  if(missing && !confirm(`${missing} ${t('st_noqty')}`)) return;
  try{ const id=await api('bo_stock_save', { p:{ id:f.id, count_date:f.count_date, location:f.location, note:f.note, lines:f.lines.map(l=>Object.assign({}, l, { qty:l.qty===''?0:l.qty })) } });
    if(finalize) await api('bo_stock_finalize', { p_id:id }); S.stForm=null; await loadStock(); render(); toast(t('saved')); }catch(e){ fail(e); }
}
async function stFinal(id){ try{ await api('bo_stock_finalize', { p_id:id }); await loadStock(); render(); toast(t('saved')); }catch(e){ fail(e); } }
async function stReopen(id){ try{ await api('bo_stock_reopen', { p_id:id }); await loadStock(); render(); }catch(e){ fail(e); } }
async function stDelete(id){ if(!confirm(t('st_del_q'))) return; try{ await api('bo_stock_delete', { p_id:id }); await loadStock(); render(); }catch(e){ fail(e); } }
function stPrintSheet(id){
  const c=S.st.counts.find(x=>x.id===id); if(!c) return; let el=document.getElementById('printArea'); if(el) el.remove();
  el=document.createElement('div'); el.id='printArea';
  el.innerHTML=`<div style="font-size:12px"><h3>Hash Inn Marina · ${t('st_sheet')} · ${t('loc_'+c.location)}</h3><div>${t('st_date')}: ____________ &nbsp; ${t('by')}: ____________</div>
    <table class="t" style="margin-top:8px"><thead><tr><th>#</th><th>${t('st_item')}</th><th>${t('st_grp')}</th><th>${t('unit')}</th><th class="right">${t('st_last')} (${c.date})</th><th>${t('st_qty')}</th></tr></thead><tbody>
    ${c.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.item)}</td><td>${t('g_'+l.grp)}</td><td>${esc(l.unit)}</td><td class="right">${l.qty}</td><td style="border-bottom:1px solid #999;width:110px"></td></tr>`).join('')}
    ${Array.from({ length:8 }).map(()=>`<tr><td></td><td style="border-bottom:1px solid #ccc"></td><td></td><td></td><td></td><td style="border-bottom:1px solid #999"></td></tr>`).join('')}</tbody></table></div>`;
  document.body.appendChild(el); document.body.classList.add('printing'); const done=()=>{ document.body.classList.remove('printing'); el.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done); window.print(); setTimeout(()=>{ if(document.body.classList.contains('printing') && !window.matchMedia('print').matches) done(); }, 1500);
}
function vStCost(){
  const d=S.st, rows=d.cost||[], hasOpen=d.opening_counts.length, hasClose=d.closing_counts.length;
  const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—', tot=k=>rows.reduce((a,r)=>a+(+r[k]||0),0);
  const used=r=>(+r.opening)+(+r.purchases)-(+r.closing);
  const line=(lbl,r)=>`<tr${lbl===t('total')?' class="tot"':''}><td>${lbl}</td><td class="right">${num(r.opening)}</td><td class="right">${num(r.purchases)}</td><td class="right">${hasClose?num(r.closing):'—'}</td><td class="right bold">${hasClose?num(used(r)):'—'}</td><td class="right">${num(r.sales)}</td>
    <td class="right bold ${hasClose&&r.sales&&used(r)/r.sales>0.4?'neg':''}">${hasClose?pct(used(r),r.sales):'—'}</td><td class="right muted">${pct(r.purchases,r.sales)}</td></tr>`;
  const T_={ opening:tot('opening'), purchases:tot('purchases'), closing:tot('closing'), sales:tot('sales') };
  const locs=l=>l.map(x=>`${t('loc_'+x.location)} ${x.date}`).join(', ')||t('none');
  return `<div class="spread noprint" style="margin-bottom:10px"><div class="row"><button class="btn sm" onclick="stShiftMonth(-1)">${t('prev')}</button><b style="font-size:16px;color:var(--navy)">${monthLabel(S.stMonth)}</b><button class="btn sm" onclick="stShiftMonth(1)" ${S.stMonth>=today().slice(0,7)?'disabled':''}>${t('next')}</button></div><button class="btn sm" onclick="window.print()">${t('print')}</button></div>
  <div class="card scroll"><table class="t"><thead><tr><th></th><th class="right">${t('st_open')}</th><th class="right">+ ${t('st_buy')}</th><th class="right">− ${t('st_close')}</th><th class="right">= ${t('st_used')}</th><th class="right">${t('st_sales')}</th><th class="right">${t('st_pct')}</th><th class="right">${t('st_pct_buy')}</th></tr></thead><tbody>
    ${rows.map(r=>line(t('g_'+r.grp), r)).join('')}${line(t('total'), T_)}</tbody></table>
    <div class="small" style="margin-top:10px">${t('st_open_from')}: <b>${locs(d.opening_counts)}</b> · ${t('st_close_from')}: <b>${locs(d.closing_counts)}</b></div>
    ${!hasOpen?`<div class="pill amber" style="margin-top:6px">${t('st_w_open')}</div>`:''} ${!hasClose?`<div class="pill amber" style="margin-top:6px">${t('st_w_close')}</div>`:''}
    <div class="small muted" style="margin-top:8px">${t('st_cost_help')}</div></div>`;
}

boot();
</script>
